    - { id: 2, name: "Practitioner Autonomy > Platform Lock-in", shorthand: "Community CLI works fully offline, no accounts, no internet" }
    - { id: 3, name: "35-Second Answers > Comprehensive Coverage", shorthand: "Answer 12 questions well, not 100 questions poorly" }
    - { id: 4, name: "Open Core Trust > Revenue Extraction", shorthand: "Community features never move to enterprise; trust is the moat" }
    - { id: 5, name: "Assume Breach > Assume Safety", shorthand: "Agent compromise must never mean server compromise" }
  conflict_hierarchy: "Axiom 1 > Axiom 2 > Axiom 3 > Axiom 4 > Axiom 5"

  non_goals:
