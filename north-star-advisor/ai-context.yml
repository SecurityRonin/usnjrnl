# ── Phase 1-4: Strategy ─────────────────────────────────────────────

strategy:
  beliefs:
    - "Forensic integrity is non-negotiable — every output must be deterministic, verifiable, and court-admissible"
    - "Speed-to-answers is a forensic imperative — the first 60 minutes determine containment success"
    - "Deleted evidence is still evidence — recovery is the baseline, not a premium feature"
    - "Practitioners deserve tools, not platforms — CLI-first, no vendor lock-in"
    - "Open source earns trust, trust earns adoption — auditable code is court-defensible code"

  kill_list:
    - "GUI-first application"
    - "Plugin/extension system"
    - "Cloud-based processing"
    - "AI/ML-based triage classification"
    - "Database-first architecture"
    - "Memory forensics"
    - "Real-time monitoring"
    - "Case management system"

  north_star_metric:
