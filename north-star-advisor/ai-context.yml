      role: "Solo DFIR Consultant"
      tier: "community"
      caseload: "3-5 cases/month"
      revenue_role: "Evangelist — discovers, validates, recommends"
      switching_trigger: "Saves >30 min/case AND doesn't miss evidence"
    - name: "Sarah Okonkwo"
      role: "MSSP Lead Analyst"
      tier: "enterprise"
      caseload: "20-30 cases/month across clients"
      revenue_role: "Champion — drives team purchase decision"
      switching_trigger: "Multi-device correlation + RBAC + Velociraptor import"
    - name: "James Whitfield"
