# ── Phase 6-7: Architecture ─────────────────────────────────────────

architecture:
  pattern: "sequential_pipeline_with_parallel_inner_stages"
  description: "Memory-Mapped I/O Pipeline with 14 modules operating within a 35-second performance budget"

  pipeline_stages:
    - { id: "ewf_parser", crate: "katana-ewf", budget: "2s", parallelism: "single-threaded", job: "Read E01/raw disk images via libewf FFI" }
    - { id: "ntfs_volume", crate: "katana-ntfs", budget: "1s", parallelism: "single-threaded", job: "Parse NTFS, extract $MFT/$UsnJrnl/$LogFile" }
    - { id: "usn_parser", crate: "katana-core", budget: "5s", parallelism: "rayon", job: "Parse USN Journal records (V2/V3/V4)" }
    - { id: "mft_parser", crate: "katana-core", budget: "5s", parallelism: "rayon", job: "Parse $MFT, extract timestamps/paths via Rewind", parallel_with: "usn_parser" }
    - { id: "ghost_recovery", crate: "katana-core", budget: "3s", parallelism: "single-threaded", job: "Recover deleted USN records from journal sparse gaps" }
    - { id: "logfile_parser", crate: "katana-core", budget: "3s", parallelism: "single-threaded", job: "Parse $LogFile for ghost record recovery" }
    - { id: "carving", crate: "katana-core", budget: "5s", parallelism: "rayon", job: "Carve USN records from unallocated space" }
    - { id: "rewind", crate: "katana-core", budget: "3s", parallelism: "single-threaded", job: "CyberCX Rewind path reconstruction" }
    - { id: "correlation", crate: "katana-core", budget: "2s", parallelism: "single-threaded", job: "QuadLink 4-artifact cross-correlation" }
    - { id: "anomaly_detection", crate: "katana-core", budget: "1s", parallelism: "single-threaded", job: "Timestomping and anti-forensics detection" }
    - { id: "triage", crate: "katana-core", budget: "2s", parallelism: "single-threaded", job: "12 automated IR triage questions" }
    - { id: "output_formatter", crate: "katana-formats", budget: "3s", parallelism: "single-threaded", job: "Emit CSV/JSONL/SQLite/XML/TLN/HTML/body" }

  handoff_triggers:
    - { from: "ewf_parser", to: "ntfs_volume", contract: "seekable volume byte stream" }
    - { from: "ntfs_volume", to: "usn_parser + mft_parser (parallel)", contract: "raw artifact byte slices" }
    - { from: "usn_parser + mft_parser", to: "ghost_recovery + logfile_parser + carving", contract: "parsed records + journal bounds" }
    - { from: "all parsers", to: "rewind", contract: "MFT entries for path resolution" }
    - { from: "rewind", to: "correlation + anomaly_detection", contract: "resolved records with full paths" }
    - { from: "correlation", to: "triage", contract: "correlated evidence set" }
    - { from: "triage", to: "output_formatter", contract: "triage results + all records" }

  agents:
    enterprise:
      - { name: "Katana Server", crate: "katana-server", framework: "axum", components: ["REST API", "gRPC (tonic)", "RBAC middleware (Tower)", "WebSocket collaboration"] }
      - { name: "Collection Agent", crate: "katana-agent", framework: "tonic gRPC", binary_size: "<5MB", cold_start: "<50ms" }
      - { name: "PCAP/NetFlow Parser", crate: "katana-pcap", implements: "EvidenceSource trait" }
      - { name: "Multi-Device Correlator", crate: "katana-multi", approach: "streaming" }
      - { name: "Collaborative Engine", crate: "katana-collab", protocol: "WebSocket" }

  tech_stack:
    community:
      - { layer: "Language", choice: "Rust 2021" }
      - { layer: "CLI", choice: "clap 4.x" }
      - { layer: "Parallelism", choice: "rayon 1.x" }
      - { layer: "Memory-mapped I/O", choice: "memmap2" }
      - { layer: "Zero-copy parsing", choice: "zerocopy" }
      - { layer: "Serialization", choice: "serde + serde_json" }
      - { layer: "EWF", choice: "libewf (FFI via bindgen)" }
      - { layer: "Database", choice: "rusqlite (SQLite)" }
      - { layer: "HTML templating", choice: "askama" }
    enterprise:
      - { layer: "HTTP", choice: "axum 0.8" }
      - { layer: "gRPC", choice: "tonic 0.14+" }
      - { layer: "TLS", choice: "rustls" }
      - { layer: "Auth middleware", choice: "Tower" }
      - { layer: "Database", choice: "PostgreSQL (sqlx)" }
      - { layer: "Search", choice: "tantivy 0.22+" }
      - { layer: "PCAP", choice: "pcap-parser + etherparse" }
      - { layer: "NetFlow", choice: "netflow_parser 0.4+" }

  agent_prompts:
    summary: "14 pipeline modules with typed contracts between stages; linear execution with parallel inner stages (usn_parser || mft_parser)"
    extension_traits: ["EvidenceSource", "TriageEngine", "OutputSink"]
    linking: "path dependencies (dev) / git dependencies (CI)"

  latency_budget:
    community: { p95: "35s", target_image: "1GB E01", parse_rate: "100K+ events/second" }
    enterprise: { core_triage: "same as community", network_overhead: "<500ms", agent_cold_start: "<50ms" }

  circuit_breakers:
    note: "Not applicable to community tier (offline CLI, no external services)"
    enterprise:
      - { component: "Agent connection", failure_threshold: "3 failures/30s", recovery: "15s", fallback: "Queue for retry" }
      - { component: "Database", failure_threshold: "2 failures/30s", recovery: "60s", fallback: "Read-only cache" }

  retry_policies:
    community: "No retries — deterministic pipeline, fail fast on fatal errors"
    enterprise_agent: "Exponential backoff with jitter (base 1s, max 60s, 5 attempts)"
    enterprise_api: "Idempotent operations retry 3x; non-idempotent fail immediately"

  fallback_strategies:
    - { tier: "QuadLink", artifacts: ["$UsnJrnl", "$MFT", "$LogFile", "$MFTMirr"], capabilities: "Full path resolution, ghost records, integrity check, timestomping, full anti-forensics" }
    - { tier: "TriForce+", artifacts: ["$UsnJrnl", "$MFT", "$LogFile"], capabilities: "Full path resolution, ghost records, timestomping", missing: "$MFTMirr" }
    - { tier: "Dual", artifacts: ["$UsnJrnl", "$MFT"], capabilities: "Full path resolution, timestomping, sdelete/ransomware", missing: "$LogFile + $MFTMirr" }
    - { tier: "USN-Only", artifacts: ["$UsnJrnl"], capabilities: "Filename-only, pattern-based detection", missing: "$MFT + $LogFile + $MFTMirr" }
    - { tier: "Carve-Only", artifacts: ["unallocated_space"], capabilities: "Best-effort recovery", missing: "All primary artifacts" }

  delegation_rules:
    pipeline_model: "linear_staged_with_optional_bypass"
    error_strategy: "log-and-skip (every anomaly is a finding, not a bug)"
    corrupt_record: "Log warning, skip, increment counter, scan forward 8 bytes"
    fatal_errors: ["No input file specified", "Image file unreadable", "No NTFS partition found"]
    max_consecutive_corrupt: 1000

  context_passing:
    internal_contracts:
      - { from: "USN Parser", to: "MFT Parser", type: "Vec<UsnRecord>", validation: "sorted by USN, deduplicated, V2/V3/V4 normalized" }
      - { from: "MFT Parser", to: "Rewind Engine", type: "MftData (HashMap<u64, MftEntry>)", validation: "root entry 5 exists" }
      - { from: "Rewind", to: "Correlation/Output", type: "Vec<ResolvedRecord>", validation: "all records have path resolution attempted" }
    external_formats: ["CSV (16 columns)", "JSONL (nested JSON)", "bodyfile (pipe-delimited)", "TLN (5-field)", "XML (structured)", "SQLite (normalized)", "HTML Report (Story + Explore tabs)"]
    integration_handoffs: ["KAPE Module", "Velociraptor VQL artifact", "Autopsy ingest module"]

# ── Phase 8: Security ───────────────────────────────────────────────

security:
  threat_model: "Forensic Tool Threat Classification (FTTC) — 10 forensic-specific threats"
  critical_threats:
    - "FT-01: Evidence Tampering — SHA-256 hash verification at ingestion"
    - "FT-02: Agent Weaponization — mTLS + cert pinning + code signing + assume-breach"
    - "FT-03: Non-Deterministic Output — same input must produce identical output across runs/versions"
    - "FT-06: Multi-Tenant Data Leak — schema-per-tenant isolation"
    - "FT-10: Audit Trail Tampering — hash-chain append-only audit log"
  all_threats:
    - { id: "FT-01", name: "Evidence Tampering", severity: "critical" }
    - { id: "FT-02", name: "Agent Weaponization", severity: "critical" }
    - { id: "FT-03", name: "Non-Deterministic Output", severity: "critical" }
    - { id: "FT-04", name: "Supply Chain Compromise", severity: "high" }
    - { id: "FT-05", name: "Insider Result Manipulation", severity: "high" }
    - { id: "FT-06", name: "Multi-Tenant Data Leak", severity: "critical" }
    - { id: "FT-07", name: "Chain of Custody Break", severity: "high" }
    - { id: "FT-08", name: "Privilege Escalation", severity: "medium" }
    - { id: "FT-09", name: "Agent Credential Theft", severity: "high" }
    - { id: "FT-10", name: "Audit Trail Tampering", severity: "critical" }

  auth_pattern:
    community: "none (fully offline, no network)"
    enterprise_users: "JWT via SSO/SAML (WorkOS/Scalekit)"
    enterprise_agents: "mTLS with certificate pinning (tonic + rustls)"
    local_fallback: "Argon2id + TOTP 2FA"

  guardrails:
    rbac_roles: ["Admin", "Case Manager", "Examiner", "Reviewer", "Auditor"]
    multi_tenancy: "schema-per-tenant (DuckDB/PostgreSQL), tenant ID in Tower middleware"
    daubert_compliance: "public test corpus, deterministic output, precision/recall per release"
    trust_boundaries:
      - { name: "Community Tier", model: "fully offline, local filesystem only" }
      - { name: "Agent-Server", model: "assume-breach, mTLS + cert pinning" }
    agent_fleet:
      enrollment: "single-use token (24h TTL), X.509 cert (90-day validity)"
      update_strategy: "staged rollout (5% canary -> 25% -> 100%)"
      kill_switches: ["agent_fleet_kill", "single_agent_kill (CRL)", "tenant_lockout", "evidence_quarantine", "emergency_shutdown"]
    incident_response:
      model: "solo developer (no on-call rotation)"
      severities: ["SEV-1 (15min)", "SEV-2 (1hr)", "SEV-3 (4hr)", "SEV-4 (24hr)"]
      escalation: "PagerDuty -> solo investigation -> contract consultant"

  key_principles:
    - "Forensic Integrity Above All (Axiom 1)"
    - "Assume Breach (Axiom 5)"
    - "Buy Auth, Build Forensics"
    - "Blast Radius Containment"

