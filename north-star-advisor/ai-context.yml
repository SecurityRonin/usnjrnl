    community: "GitHub Insights, crates.io stats, Docker Hub pulls"
    enterprise: "Prometheus + Grafana + Loki + Jaeger (all self-hosted)"
    cost_principle: "Self-host everything until revenue justifies managed services"
    community_monthly: "$0"
    enterprise_monthly: "$60-120"

  health_checks:
    community:
      - { metric: "GitHub stars growth", healthy: ">5/week", degraded: "<2/week" }
      - { metric: "Reference corpus pass rate", healthy: "100%", critical: "<100%" }
      - { metric: "Issue response time", healthy: "<48h", degraded: ">72h" }
    enterprise:
      - { metric: "API availability", slo: ">99.5%" }
      - { metric: "API latency P95", slo: "<500ms" }
      - { metric: "Triage latency P95", slo: "<35s (1GB E01)" }
      - { metric: "Agent connection success", slo: ">99%" }
      - { metric: "Agent cold start", slo: "<50ms" }

  alerts:
    stack: "Grafana Alerting -> PagerDuty (free tier)"
    severities: ["SEV-1 (15min)", "SEV-2 (1hr)", "SEV-3 (4hr)", "SEV-4 (24hr)"]
    sev1_examples: "hash chain broken, evidence tampering, agent fleet compromise"
    escalation: "PagerDuty -> solo investigation -> contract consultant"

  logging_strategy:
    framework: "env_logger 0.11"
    control: "RUST_LOG environment variable"
    stream_separation:
      stdout: "Structured forensic output only (CSV, JSONL, bodyfile, TLN, XML)"
      stderr: "Progress markers, statistics, warnings, errors, log output"
    levels:
      error: "Unrecoverable failures that abort the pipeline"
      warn: "Recoverable issues affecting completeness"
      info: "Pipeline stage transitions and summary counts"
      debug: "Per-record decisions, rewind resolution steps"
      trace: "Binary-level parser detail (byte offsets, headers)"

  tracing:
    philosophy: "100% offline, zero telemetry, zero network connections"
    enterprise: "OpenTelemetry + Jaeger (self-hosted)"
    audit_trail:
      format: "JSON sidecar file"
      flag: "--audit-log <path>"
      fields: ["Tool version + CLI invocation", "SHA-256 hashes of all inputs", "Record counts per stage", "Anomaly detection results", "Per-stage and total timing"]

  dashboards:
    community: "GitHub Insights (stars, visitors, clones, downloads)"
    enterprise: "Grafana — API latency, triage performance, agent fleet health, tenant usage"

  database_ops:
    postgresql:
      backup: "daily full (02:00 UTC), continuous WAL, weekly per-tenant dump"
      retention: "30-day full, 7-day WAL, 90-day logical"
      storage: "Backblaze B2 (S3-compatible)"
    audit_retention: "7 years"
    evidence_retention: "case lifetime + 1 year"

  checklists:
    daily: ["Grafana dashboard", "PagerDuty alerts", "backup verification", "hash-chain integrity"]
    weekly: ["GitHub Issues review", "dependency audit (cargo audit)", "metrics review"]

# ── Phase 12: Roadmap ───────────────────────────────────────────────

roadmap:
  strategic_path: "Conference Circuit Community Builder"
  day_1_definition: "The day the founder begins executing this roadmap"

  phase_1:
    name: "Establish Presence, Prove Value"
    duration: "Days 1-30"
    focus: ["KAPE Module PR submitted", "Benchmark methodology published", "First blog post + demo video", "DFIR Discord active membership", "CFP submitted"]
    resource_split: { product: "40%", content: "30%", community: "20%", strategy: "10%" }
    milestones: ["KAPE Module PR submitted", "Benchmark methodology published", "1 blog post live", "100+ GitHub unique visitors", "50+ downloads", "3+ organic mentions"]
    gate: "If fewer than 3 of 9 criteria met, re-evaluate community-first strategy"

  phase_2:
    name: "Build Community, Ship Integrations"
    duration: "Days 31-60"
    focus: ["KAPE Module merged", "Velociraptor VQL artifact submitted", "Windows binary release", "2 blog posts total", "5+ beta tester contacts"]
    resource_split: { product: "35%", content: "30%", community: "25%", enterprise_research: "10%" }
    milestones: ["KAPE module merged", "Velociraptor artifact submitted", "200+ GitHub unique visitors", "150+ cumulative downloads", "5+ enterprise beta contacts"]
    gate: "Proceed if KAPE merged and community growing; iterate if KAPE blocked"

  phase_3:
    name: "Monetize and Measure"
    duration: "Days 61-90"
    focus: ["3 enterprise features (batch, audit-log, rules)", "Enterprise landing page + payment (Stripe/Gumroad)", "First conference talk delivered", "Opt-in telemetry + Weekly Active Cases dashboard"]
    resource_split: { product: "40%", content: "20%", community: "20%", go_to_market: "20%" }
    milestones: ["3 enterprise features shipped", "Payment infrastructure live", "1+ paying customer (stretch: 5)", "1+ conference talk delivered", "300+ GitHub unique visitors", "300+ cumulative downloads"]

# ── Phase 13: Implementation ────────────────────────────────────────

implementation:
  project_structure:
    community_repo: "katana"
    community_crates:
      - { name: "katana-core", type: "library", purpose: "Shared types, traits (EvidenceSource, TriageEngine, OutputSink), parsers" }
      - { name: "katana-cli", type: "binary", purpose: "Community CLI for forensic triage" }
      - { name: "katana-formats", type: "library", purpose: "Output formatters (CSV, JSON, bodyfile, TLN, XML, SQLite, report)" }
      - { name: "katana-ewf", type: "library", purpose: "E01/raw disk image handling via libewf FFI" }
      - { name: "katana-ntfs", type: "library", purpose: "NTFS filesystem parsing ($MFT, $UsnJrnl, $LogFile)" }
    enterprise_repo: "katana-pro"
    enterprise_crates:
      - { name: "katana-server", type: "binary", purpose: "Axum REST + tonic gRPC + WebSocket collaboration" }
      - { name: "katana-agent", type: "binary", purpose: "Remote evidence collection agent (mTLS, <5MB)" }
      - { name: "katana-pcap", type: "library", purpose: "PCAP/NetFlow parsing (impl EvidenceSource)" }
      - { name: "katana-collab", type: "library", purpose: "Collaborative investigation (WebSocket)" }
      - { name: "katana-import", type: "library", purpose: "Velociraptor/Binalyze/KAPE import adapters" }
      - { name: "katana-multi", type: "library", purpose: "Multi-device correlation (streaming)" }

  setup_scripts:
    ci_community: ["fmt, clippy, test (3 OS), audit, deny, bench"]
    ci_enterprise: ["ci.yml + agent-build.yml + deploy.yml (additional)"]
    release: "6-target cross-compile, SHA256SUMS, GitHub Release"

# ── Testing ─────────────────────────────────────────────────────────

testing:
  unit_coverage:
    framework: "cargo test (Rust built-in #[test])"
    total_tests: 571
    coverage: "89.25%"
    target: "90% module unit, 80% integration"
    top_modules:
      - { module: "triage_mod", tests: 60 }
      - { module: "usn_record", tests: 54 }
      - { module: "main", tests: 36 }
      - { module: "analysis", tests: 35 }
      - { module: "logfile_usn_extractor", tests: 33 }
      - { module: "usn_reader", tests: 31 }
      - { module: "usn_carving", tests: 28 }
      - { module: "rewind", tests: 26 }
      - { module: "mft", tests: 22 }

  integration_tests:
    tiers:
      - { tier: 1, name: "Unit tests", command: "cargo test --lib", duration: "~10s", trigger: "every push" }
      - { tier: 2, name: "Unit + synthetic integration", command: "cargo test", duration: "~15s", trigger: "PR to main" }
      - { tier: 3, name: "E01 image integration", command: "cargo test --features image --test image_integration -- --ignored", duration: "~60s", trigger: "weekly" }
      - { tier: 4, name: "Precision/recall benchmark", command: "cargo test --features image --release --test precision_recall -- --ignored --nocapture", duration: "~90s", trigger: "release tag" }
      - { tier: 5, name: "Fuzz testing", command: "cargo +nightly fuzz run fuzz_usn_parse -- -max_total_time=3600", duration: "1-4 hours", trigger: "weekly" }

  golden_datasets:
    sources: ["NIST CFReDS forensic images", "Szechuan Sauce CTF image", "Hand-crafted synthetic journals"]
    coverage_areas: ["Ghost extraction ($LogFile genuine records)", "Carving accuracy (structural validation)", "Triage correctness (12 IR questions)", "Timestomping detection (SI < FN anomalies)", "Rule matching (filename/reason patterns)", "Output fidelity (format correctness)"]
    fuzz: { framework: "cargo-fuzz (libFuzzer)", coverage_tool: "cargo-llvm-cov" }

