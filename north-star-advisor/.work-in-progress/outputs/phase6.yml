architecture:
  pattern: "Memory-Mapped I/O Pipeline"
  description: "Deterministic forensic processing pipeline: E01/raw -> memmap2 -> NTFS parse -> artifact extract -> Rewind path resolve -> parallel analysis -> multi-format output"

  modules:
    - name: "main"
      path: "src/main.rs"
      role: "CLI argument parsing, pipeline orchestration, output dispatch"
    - name: "image"
      path: "src/image/mod.rs, src/image/unallocated.rs"
      role: "E01/raw image opening, NTFS partition discovery, artifact extraction, unallocated scanning"
    - name: "usn"
      path: "src/usn/mod.rs"
      role: "Binary parsing of USN_RECORD_V2, V3, V4 with streaming and parallel modes"
    - name: "mft"
      path: "src/mft/mod.rs, src/mft/carver.rs"
      role: "MFT record parsing, entry/sequence/name extraction, MFT entry carving"
    - name: "logfile"
      path: "src/logfile/mod.rs, src/logfile/usn_extractor.rs"
      role: "$LogFile RCRD page parsing, embedded USN record extraction (ghost records)"
    - name: "mftmirr"
      path: "src/mftmirr/mod.rs"
      role: "Byte-level $MFT vs $MFTMirr integrity comparison"
    - name: "rewind"
      path: "src/rewind/mod.rs"
      role: "CyberCX Rewind algorithm: reverse-chronological path reconstruction"
    - name: "correlation"
      path: "src/correlation/mod.rs"
      role: "QuadLink 4-artifact cross-correlation, ghost detection, timeline gaps"
    - name: "analysis"
      path: "src/analysis/mod.rs"
      role: "Anti-forensics detection: SDelete, ransomware, timestomping, journal clearing"
    - name: "triage"
      path: "src/triage/mod.rs, src/triage/queries.rs"
      role: "12 built-in IR triage questions, regex/extension/flag matching engine"
    - name: "rules"
      path: "src/rules/mod.rs"
      role: "Custom detection rule engine with severity levels"
    - name: "output"
      path: "src/output/mod.rs, src/output/{csv,json,sqlite,body,tln,xml}_output.rs, src/output/report.rs, src/output/stats.rs"
      role: "7 export formats + HTML triage report + stats summary"
    - name: "monitor"
      path: "src/monitor/mod.rs, src/monitor/windows.rs"
      role: "Real-time USN journal polling on Windows"
    - name: "refs"
      path: "src/refs/mod.rs"
      role: "Reference data and constants"

  tech_stack:
    - crate: "clap"
      version: "4"
      purpose: "CLI argument parsing with derive macros"
    - crate: "anyhow"
      version: "1"
      purpose: "Error handling with context chains"
    - crate: "mft"
      version: "0.6"
      purpose: "MFT record parsing"
    - crate: "ewf"
      version: "0.1"
      purpose: "EWF/E01 image format support (optional)"
    - crate: "ntfs"
      version: "0.4"
      purpose: "NTFS filesystem traversal (optional)"
    - crate: "chrono"
      version: "0.4"
      purpose: "Timestamp handling"
    - crate: "serde"
      version: "1"
      purpose: "Serialization framework"
    - crate: "serde_json"
      version: "1"
      purpose: "JSON serialization"
    - crate: "csv"
      version: "1"
      purpose: "CSV writing"
    - crate: "regex"
      version: "1"
      purpose: "Triage query pattern matching"
    - crate: "bitflags"
      version: "2"
      purpose: "USN reason and file attribute flags"
    - crate: "rayon"
      version: "1.10"
      purpose: "Data-parallel processing (work-stealing)"
    - crate: "rusqlite"
      version: "0.32"
      purpose: "SQLite output with bundled SQLite"
    - crate: "tempfile"
      version: "3"
      purpose: "Temporary directory for image extraction"
    - crate: "log"
      version: "0.4"
      purpose: "Logging facade"
    - crate: "env_logger"
      version: "0.11"
      purpose: "stderr logger (RUST_LOG)"
    - crate: "shrinkpath"
      version: "0.1"
      purpose: "Path shortening for display"

  output_formats:
    - "CSV (MFTECmd-compatible)"
    - "JSON Lines (SOAR-ingestible)"
    - "SQLite (indexed, WAL mode)"
    - "Sleuthkit body (mactime/log2timeline)"
    - "TLN (5-field pipe-delimited)"
    - "XML (structured)"
    - "HTML Report (self-contained triage with Story + Explore tabs)"

  performance_budget:
    total: "35s"
    target_image: "40 GB E01 with ~500K USN records"
    stages:
      - name: "Image open + NTFS mount"
        budget: "<1s"
        strategy: "memmap2 virtual address space"
      - name: "USN Journal parse"
        budget: "~5s"
        strategy: "Streaming 8-byte aligned scan"
      - name: "MFT parse + Rewind"
        budget: "~10s"
        strategy: "Memory-mapped random access + reverse-chron walk"
      - name: "Unallocated carving"
        budget: "~5s"
        strategy: "4MB overlapping chunks, rayon parallel scan"
      - name: "Triage + Analysis"
        budget: "~5s"
        strategy: "Cached regex compilation, parallel record iteration"
      - name: "Output generation"
        budget: "~2s"
        strategy: "SQLite WAL + single transaction; streaming BufWriter"
      - name: "HTML report"
        budget: "~1s"
        strategy: "Compile-time template, string building"
      - name: "Buffer"
        budget: "~6s"
        strategy: "Headroom for I/O variance"

  feature_flags:
    - name: "default"
      gates: "Core CLI with pre-extracted artifact support"
    - name: "image"
      gates: "E01/raw disk image support (ewf, ntfs crates)"
    - name: "enterprise (planned)"
      gates: "Velociraptor VQL, SOAR webhooks, team report sharing, centralized rules"

  integration_points:
    - name: "KAPE Module"
      type: "open-source"
      description: ".mkape module definition for KAPE artifact processing pipeline"
    - name: "Velociraptor VQL Artifact"
      type: "enterprise"
      description: "Remote NTFS triage via VQL query executing usnjrnl-forensic"
    - name: "Sleuthkit body format"
      type: "open-source"
      description: "Pipe into mactime and log2timeline for super-timelines"
    - name: "JSONL for SOAR"
      type: "open-source"
      description: "Standard JSONL output for TheHive, Cortex, Splunk SOAR ingestion"
    - name: "SQLite cross-image queries"
      type: "open-source"
      description: "Multiple runs populate same SQLite DB for cross-case analysis"
    - name: "SOAR Webhooks"
      type: "enterprise"
      description: "HTTP notifications on triage completion with structured results"

  data_flow:
    - "E01/Raw Image -> memmap2 virtual mapping -> EWF decode (if E01)"
    - "NTFS partition discovery -> Artifact extraction ($UsnJrnl, $MFT, $MFTMirr, $LogFile)"
    - "USN binary parse (V2/V3/V4) -> Vec<UsnRecord>"
    - "MFT parse -> MftData (entry->name/parent/timestamps)"
    - "LogFile RCRD parse -> Ghost UsnRecords"
    - "Unallocated carving -> Carved USN records + MFT entries"
    - "Rewind engine (seed MFT + carved MFT, walk records newest-to-oldest) -> Vec<ResolvedRecord>"
    - "Triage (12 IR questions x regex/extension/flag matching) -> Vec<TriageResult>"
    - "Output writers (7 formats + HTML report) -> Files on disk"

  error_handling:
    strategy: "Fallback Chain with anyhow context"
    levels:
      - "QuadLink (4 artifacts) -> TriForce (3) -> USN+MFT (2) -> USN-only (1) -> Error"
    principles:
      - "Never panic, never silently drop data"
      - "Degrade gracefully with logged warnings"
      - "Deterministic output for identical input"
      - "Exit codes: 0 (success), 1 (fatal), 2 (CLI error)"

  deployment:
    distribution: "Single statically-linked binary"
    targets:
      - "x86_64-unknown-linux-gnu (primary)"
      - "x86_64-pc-windows-msvc"
      - "x86_64-apple-darwin"
      - "aarch64-apple-darwin"
    install: "cargo install usnjrnl-forensic --features image"

  evolution_path:
    - phase: "Phase 1: Rapid Triage (current)"
      focus: "Single-image NTFS USN pipeline, 12 IR questions, 7 output formats"
    - phase: "Phase 2: Full Forensic Suite"
      focus: "New artifact parsers (Event Logs, Prefetch, Registry), batch processing, Velociraptor integration, ForensicAuditLog"
    - phase: "Phase 3: Case Management Platform"
      focus: "Web-based report viewer, team collaboration, RBAC/audit logging, REST API, on-premises deployment"
