# Accessibility Strategy - Extracted Outputs
# Generated by North Star Advisor v1.6.0
# Date: 2026-03-10
# Source: north-star-advisor/docs/design/ACCESSIBILITY.md

accessibility:
  wcag_target: "2.1 Level AA"

  surfaces:
    - name: "CLI terminal output"
      tier: "community + enterprise"
      key_patterns:
        - "NO_COLOR environment variable compliance"
        - "TERM=dumb degradation"
        - "Non-TTY pipe detection (strip ANSI)"
        - "Text severity prefixes: [CRITICAL], [HIGH], [MEDIUM], [LOW], [INFO], [GHOST]"
        - "ASCII severity symbols: [!!], [!], [~], [-], [.], [G]"
        - "Progress bar degradation (TTY -> non-TTY -> TERM=dumb)"
        - "Screen reader compatible structured text output"
        - "16-color ANSI fallback from 256/truecolor"

    - name: "HTML report"
      tier: "community + enterprise"
      key_patterns:
        - "WCAG 2.1 AA full compliance"
        - "Semantic landmarks (header, main, footer)"
        - "ARIA tabs pattern (Story/Explore)"
        - "Skip link to triage results"
        - "Progressive disclosure via <details> for evidence"
        - "Sortable data table with aria-sort"
        - "Live region for filter result counts"
        - "prefers-reduced-motion support"
        - "prefers-color-scheme support (dark default, light available)"
        - "Print theme for court exhibits"
        - "Focus-visible ring: 2px solid #58a6ff"

    - name: "Enterprise web UI"
      tier: "enterprise only"
      key_patterns:
        - "WCAG 2.1 AA full compliance"
        - "Live regions for pipeline progress (5s coalesce)"
        - "Live regions for WebSocket collaboration (10s coalesce)"
        - "Assertive announcements for errors and triage completion"
        - "Focus management: triage complete -> results heading"
        - "Focus management: case switch -> case heading"
        - "Modal focus trap with Esc escape"
        - "Skip links: main content, case list, triage results"
        - "Form validation with error summary + field-level errors"
        - "Keyboard shortcuts: ?, /, j/k, 1-9, e, n"
        - "Skeleton loaders with aria-busy"
        - "RBAC nav with aria-current=page"

  wcag_checklist:
    perceivable_criteria: 13
    operable_criteria: 12
    understandable_criteria: 10
    robust_criteria: 3
    total_criteria: 38

  contrast_verification:
    dark_theme:
      text_primary: { fg: "#e6edf3", bg: "#0d1117", ratio: "13.2:1", passes: true }
      text_secondary: { fg: "#9da5b4", bg: "#0d1117", ratio: "7.0:1", passes: true }
      text_muted: { fg: "#545d68", bg: "#0d1117", ratio: "3.1:1", passes: "large text only" }
      accent: { fg: "#58a6ff", bg: "#0d1117", ratio: "5.3:1", passes: true }
      critical: { fg: "#ff7b72", bg: "#0d1117", ratio: "5.5:1", passes: true }
      high: { fg: "#ffa657", bg: "#0d1117", ratio: "7.3:1", passes: true }
      medium: { fg: "#d29922", bg: "#0d1117", ratio: "5.8:1", passes: true }
      low: { fg: "#58a6ff", bg: "#0d1117", ratio: "5.3:1", passes: true }
      info: { fg: "#8b949e", bg: "#0d1117", ratio: "5.5:1", passes: true }
      ghost: { fg: "#bc8cff", bg: "#0d1117", ratio: "5.9:1", passes: true }
    light_theme:
      critical: { fg: "#cf222e", bg: "#ffffff", ratio: "5.6:1", passes: true }
      high: { fg: "#bc4c00", bg: "#ffffff", ratio: "4.6:1", passes: true }
      medium: { fg: "#7d4e00", bg: "#ffffff", ratio: "5.9:1", passes: true }
      low: { fg: "#0550ae", bg: "#ffffff", ratio: "7.0:1", passes: true }
      info: { fg: "#57606a", bg: "#ffffff", ratio: "5.2:1", passes: true }
      ghost: { fg: "#6639ba", bg: "#ffffff", ratio: "5.8:1", passes: true }

  color_blind_safe:
    strategy: "Multi-channel encoding: color + icon shape + text label + border pattern"
    severity_encoding:
      critical: { icon: "ShieldAlert", symbol: "[!!]", badge: "solid fill" }
      high: { icon: "AlertTriangle", symbol: "[!]", badge: "solid fill" }
      medium: { icon: "AlertCircle", symbol: "[~]", badge: "outline" }
      low: { icon: "Info", symbol: "[-]", badge: "outline" }
      info: { icon: "MessageCircle", symbol: "[.]", badge: "none" }
      ghost: { icon: "Ghost", symbol: "[G]", badge: "dashed outline" }
    verified_deficiencies:
      - "protanopia (no red)"
      - "deuteranopia (no green)"
      - "tritanopia (no blue)"
      - "achromatopsia (no color)"

  screen_reader_patterns:
    live_regions:
      - name: "pipeline-status"
        role: "status"
        aria_live: "polite"
        coalesce_ms: 5000
        purpose: "Triage pipeline stage progress"
      - name: "collab-activity"
        role: "log"
        aria_live: "polite"
        coalesce_ms: 10000
        purpose: "WebSocket collaboration messages"
      - name: "error-announcements"
        role: "alert"
        aria_live: "assertive"
        coalesce_ms: 0
        purpose: "Pipeline failures, connection loss, permission errors"
      - name: "triage-complete"
        role: "alert"
        aria_live: "assertive"
        coalesce_ms: 0
        purpose: "Triage completion announcement"
      - name: "filter-results"
        role: "status"
        aria_live: "polite"
        coalesce_ms: 0
        purpose: "HTML report filter result count"

  focus_management:
    strategies:
      - state: "triage_complete"
        target: "#triage-results heading"
        method: "programmatic focus with tabindex=-1"
      - state: "triage_error"
        target: "error panel heading"
        method: "programmatic focus"
      - state: "case_switch"
        target: "new case heading"
        method: "programmatic focus with tabindex=-1"
      - state: "modal_open"
        target: "first focusable in modal"
        method: "focus trap with Esc escape"
      - state: "modal_close"
        target: "trigger element"
        method: "restore saved focus"
      - state: "form_error"
        target: "error summary"
        method: "programmatic focus with tabindex=-1"

  cognitive_load:
    progressive_disclosure: "Triage cards use <details> for evidence; analyst sees badges first"
    time_expectation: "Pipeline shows step N of 7 with estimated time remaining"
    reduced_motion: "prefers-reduced-motion suppresses all animations and transitions"
    consistent_layout: "12 triage questions in deterministic order; stat cards fixed position"
    no_flashing: "Zero flashing or blinking elements; CRITICAL badge uses static bold border"

  testing_protocol:
    automated:
      - tool: "Rust integration tests"
        scope: "CLI NO_COLOR, pipe detection, TERM=dumb, severity labels"
      - tool: "axe-core"
        scope: "HTML report and enterprise web WCAG AA"
      - tool: "pa11y"
        scope: "HTML report and enterprise web regression"
      - tool: "Lighthouse"
        scope: "Enterprise web accessibility audit (target: 95+)"
    manual:
      checklist_items: 14
      screen_reader_scripts: 2
      screen_readers_tested: ["VoiceOver (macOS/Safari)", "NVDA (Windows/Firefox)"]

  component_aria:
    shared:
      - { component: "severity_badge", pattern: "role=img + aria-label" }
      - { component: "evidence_card", pattern: "role=article + aria-label" }
      - { component: "loading_states", pattern: "role=progressbar + aria-value*" }
    html_report:
      - { component: "report_tab_switcher", pattern: "tablist/tab/tabpanel" }
      - { component: "timeline_entry", pattern: "semantic li + time" }
      - { component: "data_table", pattern: "table + th scope=col + aria-sort" }
      - { component: "sparkline", pattern: "role=img + aria-label summary" }
      - { component: "stat_card", pattern: "role=group + aria-label" }
      - { component: "triage_card", pattern: "role=article + aria-expanded" }
      - { component: "triage_badge", pattern: "role=status + aria-label" }
    enterprise_web:
      - { component: "buttons", pattern: "native button + aria-disabled" }
      - { component: "case_status_badge", pattern: "role=status + text label" }
      - { component: "input_fields", pattern: "label + aria-required + aria-invalid" }
      - { component: "dashboard_card", pattern: "role=region + aria-label" }
      - { component: "analyst_avatar", pattern: "alt text + text presence indicator" }
      - { component: "audit_trail_entry", pattern: "role=log container" }
      - { component: "rbac_navigation", pattern: "nav + aria-current=page" }
      - { component: "websocket_indicator", pattern: "role=status + text label" }
      - { component: "pipeline_progress", pattern: "role=progressbar + step label" }
      - { component: "skeleton_loader", pattern: "aria-busy=true + aria-label" }

  implementation_priorities:
    p0_blocking:
      - "CLI: NO_COLOR, pipe detection, text severity prefixes, progress degradation"
      - "HTML: ARIA tabs, stat card labels, th scope, skip link, live region, focus-visible"
      - "Web: Live regions (pipeline + collab + errors), form validation, skip links"
    p1_next_release:
      - "HTML: Arrow key tabs, j/k shortcuts, print theme, reduced motion, light theme, high contrast"
      - "Web: Collab coalescing, focus trap, triage focus, case switch focus, keyboard shortcuts"
    p2_future:
      - "CI automation: pa11y + axe in pipeline"
      - "Color-blind simulation screenshots in CI"
      - "Court exhibit CSS @page headers"
