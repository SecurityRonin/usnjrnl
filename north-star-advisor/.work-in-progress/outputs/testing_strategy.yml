# Testing Strategy - Extracted Outputs
# Generated by North Star Advisor v1.6.0
# Date: 2026-03-10
# Product: Security Ronin Katana (usnjrnl-forensic)

testing:
  framework: "cargo test (built-in) + proptest + criterion + cargo-fuzz"
  language: "Rust"

  test_layers:
    - layer: "unit"
      count: "500+"
      framework: "cargo test"
      time_budget: "30s"
    - layer: "property"
      count: "100+ generators"
      framework: "proptest"
      time_budget: "60s"
    - layer: "fuzz"
      count: "4 targets"
      framework: "cargo-fuzz (libFuzzer)"
      time_budget: "24h+ continuous"
    - layer: "integration"
      count: "80+"
      framework: "cargo test --test"
      time_budget: "120s"
    - layer: "golden"
      count: "30+ cases"
      framework: "custom harness + SHA-256"
      time_budget: "90s"
    - layer: "precision_recall"
      count: "12 questions x 5+ images"
      framework: "custom metrics harness"
      time_budget: "180s"
    - layer: "performance"
      count: "9 stage budgets"
      framework: "criterion"
      time_budget: "300s"
    - layer: "e2e"
      count: "15+ scenarios"
      framework: "assert_cmd + predicates"
      time_budget: "300s"
    - layer: "enterprise"
      count: "60+"
      framework: "cargo test + tonic test utils"
      time_budget: "120s"

  coverage_targets:
    katana_core_parsers: "95% line / 90% branch"
    katana_core_triage: "90% line / 85% branch"
    katana_core_ghost: "95% line / 90% branch"
    katana_ewf: "85% line / 80% branch"
    katana_ntfs: "90% line / 85% branch"
    katana_formats: "85% line / 80% branch"
    katana_server: "80% line / 75% branch"
    katana_agent: "80% line / 75% branch"
    katana_multi: "90% line / 85% branch"

  golden_datasets:
    - id: "NIST-CFREDS-NTFS-01"
      source: "NIST CFReDS"
    - id: "SANS-DFIR-LATERAL-01"
      source: "SANS DFIR challenge"
    - id: "KATANA-RANSOMWARE-01"
      source: "lab-generated"
    - id: "KATANA-GHOST-RECOVERY-01"
      source: "lab-generated"
    - id: "KATANA-EDGE-MIXED-USN-01"
      source: "lab-generated"
    - id: "KATANA-EXFIL-01"
      source: "lab-generated"
    - id: "KATANA-PERSISTENCE-01"
      source: "lab-generated"

  accuracy_thresholds:
    false_positive_rate: "<5%"
    recall_minimum: ">=80%"
    ghost_recovery_rate: ">=95%"
    path_resolution: "100% (zero UNKNOWN)"

  performance_budgets:
    full_pipeline_p95: "35 seconds"
    ewf_parser: "2s"
    ntfs_volume: "1s"
    usn_parser: "5s"
    mft_parser: "5s"
    ghost_recovery: "3s"
    unallocated_carving: "5s"
    quadlink_correlator: "3s"
    triage_engine: "5s"
    output_formatter: "3s"
    parser_throughput: "100k+ events/second"
    memory_budget: "<2x image size"

  fuzz_targets:
    - "fuzz_usn_parser"
    - "fuzz_mft_parser"
    - "fuzz_ntfs_volume"
    - "fuzz_ewf_header"

  enterprise_test_areas:
    - "RBAC enforcement (5 roles x all permissions)"
    - "Multi-tenant isolation (schema-per-tenant DuckDB)"
    - "mTLS certificate pinning (tonic + rustls)"
    - "Audit trail hash-chain integrity"
    - "Velociraptor/Binalyze import format verification"

  daubert_artifacts:
    - "precision_recall.md"
    - "determinism_report.md"
    - "parser_coverage.md"
    - "fuzz_report.md"
    - "cross_validation.md"
    - "version_changelog.md"

  ci_jobs:
    - name: "unit-tests"
      blocks_merge: true
      timeout: "5 min"
    - name: "integration-tests"
      blocks_merge: true
      timeout: "10 min"
    - name: "golden-tests"
      blocks_merge: true
      timeout: "5 min"
    - name: "performance-tests"
      blocks_merge: true
      timeout: "10 min"
    - name: "e2e-tests"
      blocks_merge: true
      timeout: "5 min"
    - name: "coverage"
      blocks_merge: true
      timeout: "10 min"
    - name: "fuzz-smoke"
      blocks_merge: false
      timeout: "3 min"
    - name: "enterprise-tests"
      blocks_merge: true
      timeout: "5 min"
      trigger: "main only"
