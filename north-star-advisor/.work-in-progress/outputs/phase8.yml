security:
  auth_pattern: "None (local CLI, no authentication)"
  threats:
    - "Malicious disk image parser exploitation (crafted USN/MFT structures)"
    - "Path traversal via crafted NTFS filenames"
    - "HTML report XSS via adversarial filenames"
    - "MFT circular reference causing infinite recursion"
    - "Memory exhaustion via massive unallocated carving"
    - "GPL license contamination in dependency tree"
    - "Supply chain compromise via backdoored crates"
    - "Denial of service via zero-length or max-length USN records"
    - "Evidence tampering via accidental source image modification"
    - "Forensic inaccuracy from ghost/carved record misclassification"
  guardrails:
    - "Rust memory safety (no buffer overflows, use-after-free, data races)"
    - "USN record structural validation (length 64-65536, 8-byte aligned, version check)"
    - "MFT entry validation (FILE signature, bounds-checked attributes)"
    - "Recursion depth limit of 256 in Rewind path resolution"
    - "Timestamp sanity range 2000-2030"
    - "Read-only source image access (File::open, no write flags)"
    - "Temporary extraction via tempfile::TempDir (auto-cleanup)"
    - "JSON encoding for HTML report (serde_json escapes HTML characters)"
    - "CSV RFC 4180 escaping via csv crate"
    - "SQLite parameterized queries via rusqlite (no string interpolation)"
    - "XML entity escaping"
    - "Chunk-based carving with bounded memory (4MB chunks)"
    - "cargo audit for CVE scanning"
    - "cargo deny for license and advisory checking"
    - "Minimal dependencies (15 direct, all MIT/Apache-2.0)"
    - "No network calls, no telemetry, 100% offline"
    - "Deterministic output ordering by USN offset"
    - "RecordSource provenance enum (Allocated/Ghost/Carved) on every record"
  court_admissibility:
    - "Testable methodology: Rewind algorithm published by CyberCX (April 2024)"
    - "Peer review: validated against 5 other parsers on 757,491 records"
    - "Known error rate: 100% path resolution on tested images, precision/recall per triage question"
    - "Standards compliance: MFTECmd CSV format, Sleuthkit body format, log2timeline compatible"
    - "General acceptance: implements TriForce (David Cowen) and Rewind (CyberCX) techniques"
    - "Deterministic output: same input + flags = byte-identical output"
    - "Version pinning: tool version embedded in report metadata"
    - "Source availability: Apache-2.0 open source, defense counsel can audit"
    - "Record provenance: Allocated/Ghost/Carved source labeled on every record"
    - "Build reproducibility: Cargo.lock pins all dependency versions"
  threat_model: "STRIDE (adapted for local CLI forensic tool, not OWASP Agentic)"
  trust_boundaries:
    - boundary: "TB0: Untrusted -> Validation"
      enforcement: "All bytes from disk image treated as adversarial; structural validation before parsing"
    - boundary: "TB1: Validation -> Processing"
      enforcement: "Parsed records validated but filenames remain untrusted; sanitize for path construction"
    - boundary: "TB2: Processing -> Output"
      enforcement: "Resolved paths sanitized per output format (JSON-encode, CSV-escape, SQL-parameterize)"
    - boundary: "TB3: Output -> Filesystem"
      enforcement: "Output paths from CLI args only; no paths constructed from NTFS filenames"
  fuzz_targets:
    - "fuzz_usn_parser: random bytes as USN journal"
    - "fuzz_mft_parser: random bytes as MFT"
    - "fuzz_rewind_resolve: crafted lookup tables for path resolution"
    - "fuzz_carving_pipeline: random bytes as unallocated space"
    - "fuzz_html_report: records with adversarial filenames"
  dependency_policy:
    allowed_licenses: ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unlicense", "Zlib"]
    denied_licenses: ["GPL-2.0", "GPL-3.0", "AGPL-3.0", "LGPL-2.1", "LGPL-3.0", "SSPL-1.0"]
    direct_dependency_count: 15
    optional_dependencies: ["ewf (image feature)", "ntfs (image feature)"]
  incident_response:
    sev1: "Parser vulnerability exploitable by crafted input -- 24h response"
    sev2: "Output correctness bug affecting evidence accuracy -- 48h response"
    sev3: "Dependency vulnerability via cargo audit advisory -- 1 week response"
    sev4: "Non-exploitable code quality issue -- next release"
