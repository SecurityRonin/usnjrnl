# Generated by North Star Advisor v1.6.0
# Date: 2026-03-10
# Product: Security Ronin Katana (usnjrnl-forensic)

operations:
  deployment_models:
    - tier: "community"
      distribution: ["GitHub Releases (static binary)", "cargo install", "Docker image"]
      infrastructure: "none (runs on user's machine)"
      monitoring: "GitHub Insights, crates.io stats, Docker Hub pulls"
    - tier: "enterprise"
      distribution: ["Docker image (server)", "signed binary (agent)"]
      infrastructure: "VPS (Hetzner/OVH) + PostgreSQL + tantivy"
      monitoring: "Prometheus + Grafana + Loki + Jaeger"

  observability_stack:
    metrics: "Prometheus (self-hosted)"
    dashboards: "Grafana (self-hosted)"
    logs: "Grafana Loki (structured JSON via tracing crate)"
    traces: "OpenTelemetry + Jaeger (self-hosted)"
    alerting: "Grafana Alerting -> PagerDuty (free tier)"

  health_checks:
    community:
      - metric: "GitHub stars growth"
        healthy: ">5/week"
        degraded: "<2/week"
      - metric: "Reference corpus pass rate"
        healthy: "100%"
        critical: "<100%"
      - metric: "Issue response time"
        healthy: "<48h"
        degraded: ">72h"
    enterprise:
      - metric: "API availability"
        slo: ">99.5%"
      - metric: "API latency P95"
        slo: "<500ms"
      - metric: "Triage latency P95"
        slo: "<35s (1GB E01)"
      - metric: "Agent connection success"
        slo: ">99%"
      - metric: "Agent cold start"
        slo: "<50ms"

  release_management:
    versioning: "semantic versioning"
    signing: "Ed25519 via minisign"
    deterministic_builds: true
    cross_compile_targets:
      - "x86_64-unknown-linux-gnu"
      - "x86_64-apple-darwin"
      - "aarch64-apple-darwin"
      - "x86_64-pc-windows-msvc"
    release_gates:
      - "Reference corpus 100% pass"
      - "Precision >95% per triage question"
      - "Recall >90% per triage question"
      - "Ghost recovery >90%"
      - "P95 <35s on 1GB E01"
      - "cargo audit clean"
      - "Deterministic build verified"

  agent_fleet:
    enrollment: "single-use token (24h TTL), X.509 cert (90-day validity)"
    update_strategy: "staged rollout (5% canary -> 25% -> 100%)"
    health_signals: ["heartbeat", "cert expiry", "version currency", "resource usage", "collection queue"]
    cert_rotation: "automated at 30 days remaining, 90-day validity"
    kill_switches:
      - "agent_fleet_kill (all agents stop)"
      - "single_agent_kill (CRL revocation)"
      - "tenant_lockout (all tenant access suspended)"
      - "evidence_quarantine (read-only lock)"
      - "emergency_shutdown (graceful full stop)"

  database_ops:
    postgresql:
      backup_full: "daily (02:00 UTC), 30-day retention"
      backup_wal: "continuous, 7-day retention"
      backup_logical: "weekly per-tenant dump, 90-day retention"
      backup_storage: "Backblaze B2 (S3-compatible)"
      maintenance: "weekly VACUUM ANALYZE, monthly bloat check"
    tantivy:
      audit_log_retention: "7 years"
      evidence_retention: "case lifetime + 1 year"
      agent_telemetry_retention: "90 days"

  audit:
    type: "hash-chain (SHA-256)"
    verification: "daily automated chain integrity check"
    tamper_response: "SEV-1 incident"
    legal_export: "PDF with hash-chain verification attestation"

  incident_response:
    model: "solo developer (no on-call rotation)"
    severity_levels:
      - level: "SEV-1"
        response_time: "15 minutes"
        notification: "PagerDuty phone call"
        examples: "hash chain broken, evidence tampering, agent fleet compromise"
      - level: "SEV-2"
        response_time: "1 hour"
        notification: "PagerDuty push"
        examples: "RBAC bypass, cross-tenant access, server down"
      - level: "SEV-3"
        response_time: "4 hours"
        notification: "email alert"
        examples: "single agent offline, degraded performance, failed backup"
      - level: "SEV-4"
        response_time: "24 hours"
        notification: "email digest"
        examples: "non-critical bug, documentation gap"
    escalation: "automated containment -> PagerDuty -> solo investigation -> contract consultant (if needed)"

  compliance:
    active: ["Daubert standard", "NIST SP 800-86", "ISO 27037"]
    planned: ["SOC 2 Type I (Phase 3)", "SOC 2 Type II (post 25 customers)"]
    future: ["CJIS (on demand)"]
    not_planned: ["FedRAMP"]

  cost:
    community_monthly: "$0"
    enterprise_monthly: "$60-120"
    scaling_trigger: "$10K MRR -> budget for managed services"
    principle: "self-host everything until revenue justifies managed services"

  checklists:
    daily: ["Grafana dashboard", "PagerDuty alerts", "backup verification", "hash-chain integrity"]
    weekly: ["GitHub Issues triage", "cargo audit", "community metrics", "enterprise metrics"]
    monthly: ["VACUUM ANALYZE", "cert inventory", "tenant isolation test", "cost review"]
    quarterly: ["strategy review vs North Star", "re-evaluation triggers", "kill list", "RBAC audit", "Daubert packet"]

  contacts:
    founder: "@4n6h4x0r"
    community_support: "github.com/h4x0r/katana/issues"
    enterprise_support: "support@securityronin.com"
    security_reports: "security@securityronin.com"
