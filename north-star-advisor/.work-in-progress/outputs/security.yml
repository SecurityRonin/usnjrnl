# Security Architecture - Extracted Outputs
# Generated by North Star Advisor v1.6.0
# Date: 2026-03-10
# Product: Security Ronin Katana (usnjrnl-forensic)

security:
  threat_model:
    classification: "Forensic Tool Threat Classification (FTTC)"
    threats:
      - id: "FT-01"
        name: "Evidence Tampering"
        severity: "critical"
        description: "Modification of E01/raw images before or during analysis"
      - id: "FT-02"
        name: "Agent Weaponization"
        severity: "critical"
        description: "Collection agent repurposed as C2 or lateral movement tool"
      - id: "FT-03"
        name: "Non-Deterministic Output"
        severity: "critical"
        description: "Same input producing different results across runs/versions"
      - id: "FT-04"
        name: "Supply Chain Compromise"
        severity: "high"
        description: "Malicious cargo crate injecting backdoor into parser"
      - id: "FT-05"
        name: "Insider Result Manipulation"
        severity: "high"
        description: "Analyst modifying findings before court submission"
      - id: "FT-06"
        name: "Multi-Tenant Data Leak"
        severity: "critical"
        description: "MSSP customer A accessing customer B evidence"
      - id: "FT-07"
        name: "Chain of Custody Break"
        severity: "high"
        description: "Unaudited access to evidence destroying legal admissibility"
      - id: "FT-08"
        name: "Privilege Escalation"
        severity: "medium"
        description: "Examiner gaining Admin or cross-case access"
      - id: "FT-09"
        name: "Agent Credential Theft"
        severity: "high"
        description: "Extraction of mTLS certificates or tokens from agent binary"
      - id: "FT-10"
        name: "Audit Trail Tampering"
        severity: "critical"
        description: "Deletion or modification of forensic audit logs"

  auth_patterns:
    community_tier: "none"
    enterprise_users: "JWT via SSO/SAML (WorkOS/Scalekit)"
    enterprise_agents: "mTLS with certificate pinning (tonic + rustls)"
    local_fallback: "Argon2id + TOTP 2FA"

  trust_boundaries:
    - name: "Community Tier"
      model: "fully offline, no auth, user responsible for chain of custody"
      attack_surface: "local filesystem only"
    - name: "Agent-Server Boundary"
      model: "assume-breach, mTLS + cert pinning"
      attack_surface: "gRPC/HTTP2 endpoint"
    - name: "User-Server Boundary"
      model: "JWT + RBAC via Tower middleware"
      attack_surface: "REST API endpoints"
    - name: "Tenant Isolation Boundary"
      model: "schema-per-tenant in DuckDB, middleware-enforced"
      attack_surface: "cross-tenant queries, shared filesystem"

  rbac:
    roles:
      - name: "Admin"
        scope: "system-wide"
        key_permissions: ["user.manage", "system.config", "audit.view", "case.*"]
      - name: "Case Manager"
        scope: "assigned cases"
        key_permissions: ["case.create", "case.manage", "case.close", "examiner.assign"]
      - name: "Examiner"
        scope: "assigned cases"
        key_permissions: ["evidence.ingest", "evidence.annotate", "triage.run", "report.generate"]
      - name: "Reviewer"
        scope: "assigned cases (read-only)"
        key_permissions: ["evidence.view", "findings.approve", "findings.reject"]
      - name: "Auditor"
        scope: "system-wide (read-only)"
        key_permissions: ["audit.view", "case.view_all", "evidence.view_all"]
    enforcement: "Tower middleware (pre-handler)"
    granularity: "case-level + evidence-level"

  multi_tenancy:
    isolation: "schema-per-tenant (DuckDB)"
    tenant_routing: "tenant_id embedded in JWT and mTLS cert CN"
    middleware: "Tower layer injects tenant context on every request"
    file_isolation: "/data/tenants/{tenant_id}/cases/{case_id}/evidence/"

  agent_hardening:
    controls:
      - "mTLS with certificate pinning (tonic + rustls)"
      - "Ed25519 code signing on all binaries"
      - "No static credentials (cert-based only)"
      - "Resource throttling (CPU 15%, memory 256MB, IO 50MB/s)"
      - "Collection scoping with artifact allowlists"
      - "Network isolation (agent to enrolled server only)"
      - "Certificate revocation list (CRL) checked per connection"
      - "OS-level tamper protection"
    blast_radius: "compromised agent cannot escalate to server, access other tenants, or communicate with other agents"
    enrollment: "single-use token, 24h TTL, X.509 cert issued, 90-day validity"

  audit:
    type: "hash-chain (SHA-256)"
    storage: "append-only, no UPDATE/DELETE"
    tamper_detection: "each entry contains SHA-256 of previous entry"
    verification: "daily automated chain integrity check"
    legal_export: "PDF with hash-chain verification attestation"

  daubert_compliance:
    testability: "open-source code, public test corpus, deterministic processing"
    peer_review: "open-source repository, public issue tracker"
    known_error_rate: "precision/recall analysis published per release (>95% precision, >90% recall)"
    standards: "NIST SP 800-86, ISO 27037"
    general_acceptance: "standard DFIR techniques (USN, MFT, timeline reconstruction)"
    daubert_packet: "docs/daubert/ (methodology, validation, error rates, expert witness template)"

  resilience:
    kill_switches:
      - "agent_fleet_kill (all agents stop)"
      - "single_agent_kill (CRL revocation)"
      - "tenant_lockout (all tenant users/agents suspended)"
      - "evidence_quarantine (read-only lock)"
      - "emergency_shutdown (graceful full shutdown)"
    safeguards:
      - "rate limiting (100 req/min per user)"
      - "evidence size limit (500GB per file)"
      - "concurrent analysis limit (10 simultaneous)"
      - "circuit breaker (5 consecutive failures)"

  incident_response:
    severity_levels: ["SEV-1 (15min)", "SEV-2 (1hr)", "SEV-3 (4hr)", "SEV-4 (24hr)"]
    sev1_examples: "hash chain broken, evidence tampering, agent fleet compromise"
    sev2_examples: "RBAC bypass, cross-tenant access, unauthorized agent deployment"
    procedure: "preserve evidence first, then contain, then remediate"

  security_principles:
    - "Forensic Integrity Above All (Axiom 1)"
    - "Assume Breach (Axiom 5)"
    - "Two-Tier Trust (community=zero attack surface, enterprise=defense in depth)"
    - "Evidence is Immutable (never modify source)"
    - "Audit Trail is Evidence (same integrity standards)"
    - "Buy Auth, Build Forensics (WorkOS for SSO, in-house for integrity)"
    - "Blast Radius Containment (no cascading compromise)"
