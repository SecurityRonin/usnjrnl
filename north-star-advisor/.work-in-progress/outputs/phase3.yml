competitive:
  market_category: "DFIR forensic triage tools"
  market_size: "USD 10.46B (2025) -> USD 26.43B (2030), 20.37% CAGR"
  market_shifts:
    - "AI-Assisted Forensics (68% practitioner adoption, up from 20% in 2024)"
    - "Open-Source DFIR Tool Adoption (2025 PLOS ONE Daubert framework validates court admissibility)"
    - "Ransomware Investigation Surge (679 attacks/month Jan 2026, 12,195 breaches in 2025)"
  direct_competitors:
    - name: "MFTECmd (Eric Zimmerman)"
      threat_level: "high"
      reason: "De facto NTFS parser standard, SANS-endorsed, massive community"
    - name: "X-Ways Forensics"
      threat_level: "low"
      reason: "Powerful but expensive, no automated triage, different market tier"
    - name: "Magnet AXIOM"
      threat_level: "low-medium"
      reason: "Enterprise suite moving toward AI, not specialized triage"
    - name: "EnCase (OpenText)"
      threat_level: "low"
      reason: "Legacy tool, declining practitioner preference, unlikely to innovate in CLI triage"
    - name: "Autopsy (Sleuth Kit)"
      threat_level: "low"
      reason: "GUI-first, Java ecosystem, no USN triage specialization"
  category_adjacent:
    - name: "KAPE (Eric Zimmerman)"
      threat_level: "high"
      relationship: "Complementary -- KAPE collects, usnjrnl-forensic analyzes"
    - name: "Velociraptor (Rapid7)"
      threat_level: "medium"
      relationship: "Complementary -- remote collection + VQL queries"
    - name: "Plaso/log2timeline"
      threat_level: "low"
      relationship: "Adjacent -- super-timelines, slow, no triage questions"
    - name: "Cyber Triage (Sleuth Kit Labs)"
      threat_level: "medium"
      relationship: "Adjacent -- live endpoint triage, not disk image analysis"
  differentiators:
    - "QuadLink correlation (4-artifact: $UsnJrnl + $MFT + $LogFile + $MFTMirr)"
    - "Ghost record recovery from $LogFile"
    - "Rewind path reconstruction through MFT entry reuse"
    - "12 automated IR triage questions"
    - "35-second E01-to-answers pipeline"
    - "Cross-platform (Linux, macOS, Windows)"
    - "7 output formats in single run"
  whitespace:
    - "Solo DFIR consultants who can't afford AXIOM (5K-15K practitioners)"
    - "MSSP analysts drowning in case volume (15-30 cases/month)"
    - "Ransomware first responders in the golden hour"
    - "DFIR CLI for Unix/macOS practitioners (no native NTFS triage tool exists)"
    - "Open-source forensic triage with published Daubert-ready benchmarks"
  forward_opportunities_6mo:
    - "KAPE Module integration (embed in KAPE processing pipeline)"
    - "Velociraptor VQL artifact (remote NTFS triage at scale)"
    - "Published benchmark suite (precision/recall/speed against NIST CFReDS)"
    - "Conference circuit debut (SANS DFIR Summit, DFRWS, OSDFCon)"
  forward_opportunities_18mo:
    - "AI-assisted triage summaries (local LLM narrative generation)"
    - "Artifact coverage expansion (Event Logs, Prefetch, Registry, Shimcache)"
    - "Enterprise pilot program (90-day structured evaluation)"
    - "Multi-image batch processing (10-100+ E01 images in single command)"
  offensive_moves:
    - "Own the QuadLink narrative (blog + conference talk defining the standard)"
    - "KAPE + Velociraptor ecosystem integration (ship both in same quarter)"
    - "Benchmark-driven trust campaign (precision/recall CI pipeline)"
    - "Conference circuit presence (SANS, DFRWS, OSDFCon, BSides)"
    - "Community contributor program (triage rules, output plugins, reference images)"
  defensive_moves:
    - "Monitor MFTECmd for triage features (weekly GitHub release checks)"
    - "Protect speed claim via automated benchmark pipeline"
    - "Maintain open-source core integrity (no forensic analysis behind paywall)"
    - "Defensive publication of QuadLink/ghost recovery/rewind algorithms"
  rejected_moves:
    - "Build a GUI (contradicts CLI-first brand, HTML report serves visual need)"
    - "Add memory forensics (Volatility handles this, would create monolithic suite)"
    - "Build real-time monitoring agent (EDR/XDR territory, Velociraptor handles this)"
    - "Become a SaaS platform (forensic evidence cannot go to cloud)"
    - "Pursue law enforcement market first (long procurement cycles, follow after benchmarks)"
  novelty_innovations:
    - name: "QuadLink Correlation"
      status: "validated"
      evidence: "Extends David Cowen's TriForce (2013) with $MFTMirr as fourth artifact"
    - name: "Ghost Record Recovery"
      status: "validated"
      evidence: "$LogFile USN records not present in active $UsnJrnl; unique to usnjrnl-forensic"
    - name: "Rewind Path Reconstruction"
      status: "validated"
      evidence: "Native cross-artifact MFT reuse resolution; CyberCX Rewind requires MFTECmd prerequisite"
    - name: "Automated Triage Questions"
      status: "validated"
      evidence: "No NTFS parser includes IR question engine; 12 structured questions with evidence indices"
    - name: "35-Second Pipeline"
      status: "validated-with-caveat"
      evidence: "Genuine for NTFS-scoped triage; not comparable to full-disk analysis tools"
  honest_gaps:
    - "No GUI (CLI-only, HTML report is the visual interface)"
    - "NTFS-only (no ext4, APFS, HFS+ support)"
    - "USN Journal focused (no Event Log, Prefetch, Registry, Shimcache parsing)"
    - "No live collection (requires disk image or pre-extracted artifacts)"
    - "No memory forensics (out of scope)"
    - "No network forensics (out of scope)"
    - "Small community (young project, no SANS endorsement yet)"
    - "No case management (Phase 3 roadmap)"
