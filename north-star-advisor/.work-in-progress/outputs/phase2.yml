northstar:
  metric:
    name: "Weekly Active Cases Triaged"
    definition: "Number of unique forensic cases where usnjrnl-forensic was used to answer at least one triage question in the past 7 days"
  anti_metrics:
    - "GitHub stars (vanity signal, zero effort, indicates interest not usage)"
    - "Download count (too many steps removed from value delivery)"
    - "Lines of code (complexity proxy that incentivizes bloat)"
    - "Feature count (encourages checkbox features over depth)"
  input_metrics:
    - name: "Time-to-first-answer"
      target: "< 35 seconds from --image to first triage question answered"
    - name: "Triage question accuracy"
      target: "> 90% precision, > 95% recall per question"
    - name: "Output format coverage"
      target: "7 formats (CSV, JSONL, SQLite, Body, TLN, XML, HTML)"
    - name: "Ghost record recovery rate"
      target: "> 95% of recoverable records from $LogFile"
    - name: "Path resolution completeness"
      target: "0 UNKNOWN paths on all tested images"
    - name: "Installation-to-first-run"
      target: "< 2 minutes from discovery to running on a case"
  personas:
    - name: "Alex the Solo Consultant"
      role: "Independent DFIR practitioner"
      caseload: "3-5 cases/month"
      decision_authority: "Makes own tool purchasing decisions"
      switching_trigger: "Saves > 30 minutes per case without missing evidence"
    - name: "Sam the MSSP Analyst"
      role: "SOC/IR analyst at managed security provider"
      caseload: "15-30 cases/month"
      decision_authority: "Recommends tools to team lead"
      switching_trigger: "Reduces per-case triage time by 50%+ with SOAR-compatible output"
  phases:
    - name: "MVP -- Rapid Triage"
      scope: "Best-in-class NTFS USN journal analysis: E01 image opening, USN parsing (V2/V3/V4), MFT correlation, Rewind path reconstruction, ghost recovery, unallocated carving, QuadLink correlation, 12 IR triage questions, 7 output formats, HTML report, timestomping detection, custom rule engine"
      exit_criteria: "50 paying customers, zero UNKNOWN paths, >90% precision / >95% recall, <35s on 40GB E01"
    - name: "Full Forensic Suite"
      scope: "Expand artifact coverage: Windows Event Logs, Prefetch, Registry hives, Shimcache/Amcache, full $LogFile transaction replay, multi-image batch processing, Velociraptor integration"
      entry_criteria: "Phase 1 revenue target met, USN journal triage objectively best-in-class"
    - name: "Case Management Platform"
      scope: "Team collaboration layer: web-based report viewer, case timeline aggregation, team annotations, RBAC/audit logging, API access, on-premises deployment"
      entry_criteria: "Phase 2 complete, enterprise customer pipeline with explicit demand"
  kill_list:
    - "Monolithic forensic suite"
    - "GUI-first application"
    - "Enterprise-only product"
    - "Closed-source binary"
    - "Feature-checkbox tool"
    - "Real-time monitoring agent"
    - "Memory forensics tool"
    - "Case management system (Phase 1)"
    - "Network forensics tool"
  positioning:
    tagline: "35-second NTFS forensic triage -- from disk image to incident response answers"
    pillars:
      - "Speed: 35 seconds, benchmarked, not marketed"
      - "Depth: ghost recovery, unallocated carving, QuadLink, Rewind"
      - "Trust: Apache-2.0, published benchmarks, courtroom-defensible"
  licensing:
    core: "Apache-2.0"
    iron_rule: "No forensic analysis capability is ever gated behind a paid tier"
    tiers:
      - name: "Community"
        license: "Apache-2.0"
        includes: "Full forensic engine, all analysis features, all output formats"
      - name: "Professional"
        license: "Proprietary"
        includes: "Priority support, pre-built integrations, team report sharing, custom rule library"
      - name: "Enterprise"
        license: "Proprietary"
        includes: "SSO/SAML, audit logging, centralized rule management, API access, SLA support"
  go_to_market:
    sequence:
      - "Solo consultants (community adoption, tool evangelism)"
      - "MSSP/MDR (volume use, integration demand)"
      - "Enterprise IR (paid tier, compliance features)"
      - "Law enforcement (court-defensible methodology)"
    launch_channels:
      - "GitHub open beta with pre-built binaries"
      - "DFIR Discord, X/Twitter, LinkedIn, Reddit r/computerforensics"
      - "Conference circuit: SANS DFIR Summit, OSDFCon, BSides"
      - "Blog post: 12 IR questions in 35 seconds walkthrough"
