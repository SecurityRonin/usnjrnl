# Observability Document - Extracted Outputs
# Generated by North Star Advisor v1.6.0
# Date: 2026-03-10
# Product: Security Ronin Katana (usnjrnl-forensic)

trace_architecture:
  root_span: "Pipeline Run Trace"
  hierarchy:
    - "Image Parsing (EWF, Partition, NTFS)"
    - "Artifact Parsing (USN, MFT, LogFile, Carver) [parallel]"
    - "Correlation (Rewind, QuadLink)"
    - "Triage (21 questions, YAML rules)"
    - "Output (7 formats)"
  span_id_format: "UUIDv7"
  propagation: "run_id links all stages"

event_types:
  - "pipeline.start"
  - "pipeline.end"
  - "stage.start"
  - "stage.end"
  - "stage.error"
  - "artifact.discovered"
  - "parser.chunk"
  - "triage.question"
  - "triage.rule"
  - "ghost.recovered"
  - "output.written"
  - "correlation.match"
  - "rewind.resolution"

handler_interface:
  trait_name: "TraceHandler"
  methods: ["on_event", "flush", "shutdown"]
  manager: "TraceManager (fan-out to registered handlers)"

community_tier:
  handler: "TracingCrateHandler"
  framework: "tracing + tracing-subscriber"
  cli_progress: "indicatif progress bars (TTY) / periodic eprintln (non-TTY)"
  verbose_flag: "--verbose for per-stage timing"
  json_logs: "--json-logs for machine-parseable output"
  network_connections: "zero"

enterprise_tier:
  handler: "OtelHandler"
  framework: "opentelemetry + opentelemetry-otlp (tonic gRPC)"
  activation: "OTEL_EXPORTER_OTLP_ENDPOINT environment variable"
  prometheus_endpoint: "/metrics"
  request_isolation: "tokio task_local RequestContext per HTTP request"
  tenant_isolation: "tenant.id span attribute, schema-per-tenant"

stage_budgets:
  total_budget_seconds: 35
  active_processing_seconds: 32
  io_margin_seconds: 3
  stages:
    - name: "EWF Parser"
      budget_seconds: 2
      metric: "stage.ewf.duration_ms"
    - name: "NTFS Volume"
      budget_seconds: 1
      metric: "stage.ntfs.duration_ms"
    - name: "USN Journal Parser"
      budget_seconds: 5
      metric: "stage.usn.duration_ms"
    - name: "MFT Parser"
      budget_seconds: 5
      metric: "stage.mft.duration_ms"
    - name: "Ghost Recovery"
      budget_seconds: 3
      metric: "stage.ghost.duration_ms"
    - name: "Unallocated Carving"
      budget_seconds: 5
      metric: "stage.carve.duration_ms"
    - name: "QuadLink Correlator"
      budget_seconds: 3
      metric: "stage.quadlink.duration_ms"
    - name: "Triage Engine"
      budget_seconds: 5
      metric: "stage.triage.duration_ms"
    - name: "Output Formatter"
      budget_seconds: 3
      metric: "stage.output.duration_ms"

pii_sanitization:
  default_mode: "strict"
  modes: ["strict", "moderate", "permissive"]
  permissive_interlock: "KATANA_DEV_MODE=1 AND --permissive-logging"
  sensitive_fields:
    - "evidence_path"
    - "file_path"
    - "ntfs_path"
    - "hostname"
    - "sid"
    - "username"
    - "ip_address"
    - "volume_serial"
  safe_fields:
    - "run_id"
    - "stage_name"
    - "duration_ms"
    - "records_processed"

prometheus_metrics:
  - "katana_pipeline_runs_total"
  - "katana_pipeline_duration_seconds"
  - "katana_stage_duration_seconds"
  - "katana_records_processed_total"
  - "katana_triage_questions_fired_total"
  - "katana_triage_completion_total"
  - "katana_active_agents"
  - "katana_collection_queue_depth"
  - "katana_agent_errors_total"
  - "katana_agent_last_heartbeat_seconds"

dashboard_panels:
  - "Pipeline Health"
  - "Stage Performance"
  - "Agent Fleet"
  - "Triage Accuracy"
  - "North Star Tracking"

alert_rules:
  - name: "Pipeline failure rate > 5%"
    severity: "critical"
  - name: "P95 latency > 35s"
    severity: "warning"
  - name: "Stage budget exceeded 3x"
    severity: "warning"
  - name: "Agent disconnected > 5 min"
    severity: "warning"
  - name: "Collection queue depth > 100"
    severity: "warning"
  - name: "Triage completion < 90%"
    severity: "critical"
  - name: "Zero pipeline runs in 1 hour"
    severity: "info"
  - name: "Agent error spike"
    severity: "warning"

crate_dependencies:
  both_tiers:
    - "tracing 0.1"
    - "tracing-subscriber 0.3"
    - "sha2 0.10"
    - "uuid 1.0"
  community_only:
    - "indicatif 0.17"
  enterprise_only:
    - "opentelemetry 0.28"
    - "opentelemetry-otlp 0.28"
    - "opentelemetry_sdk 0.28"
    - "prometheus 0.13"
    - "lazy_static 1.4"
  feature_flag: "enterprise"

infrastructure:
  recommended: "Grafana Cloud free tier OR self-hosted Grafana + Prometheus + Tempo + Loki"
  free_tier_limits:
    metrics: "10,000 series"
    logs: "50 GB/month"
    traces: "50 GB/month"
  self_hosted_cost: "$20/month single VPS through first 50 customers"
