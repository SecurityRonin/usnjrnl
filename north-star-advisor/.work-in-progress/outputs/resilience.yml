# Resilience Patterns - Extracted Outputs
# Generated by North Star Advisor v1.6.0
# Date: 2026-03-10
# Product: Security Ronin Katana (usnjrnl-forensic)

circuit_breakers:
  community:
    type: "record-level"
    max_consecutive_corrupt: 1000
    action: "log + skip + increment counter"
  enterprise:
    - service: "PostgreSQL"
      failure_threshold: 3
      success_threshold: 2
      open_timeout_seconds: 30
      reset_window_seconds: 60
    - service: "OpenSearch"
      failure_threshold: 5
      success_threshold: 3
      open_timeout_seconds: 45
      reset_window_seconds: 120
    - service: "gRPC Agent Channel"
      failure_threshold: 3
      success_threshold: 1
      open_timeout_seconds: 15
      reset_window_seconds: 30
    - service: "WebSocket Collaboration"
      failure_threshold: 3
      success_threshold: 2
      open_timeout_seconds: 10
      reset_window_seconds: 20
    - service: "Redis"
      failure_threshold: 3
      success_threshold: 2
      open_timeout_seconds: 20
      reset_window_seconds: 60

fallback_chains:
  community:
    artifact_tiers:
      - tier: "QuadLink"
        artifacts: ["$UsnJrnl", "$MFT", "$LogFile", "$MFTMirr"]
        capabilities: ["full path resolution", "ghost records", "integrity check", "timestomping", "anti-forensics"]
      - tier: "TriForce+"
        artifacts: ["$UsnJrnl", "$MFT", "$LogFile"]
        capabilities: ["full path resolution", "ghost records", "timestomping"]
      - tier: "Dual"
        artifacts: ["$UsnJrnl", "$MFT"]
        capabilities: ["full path resolution", "timestomping", "SDelete + Ransomware detection"]
      - tier: "USN-Only"
        artifacts: ["$UsnJrnl"]
        capabilities: ["filename only", "pattern-based detection"]
      - tier: "Carve-Only"
        artifacts: ["unallocated space"]
        capabilities: ["best-effort carved records"]
      - tier: "Empty"
        artifacts: []
        capabilities: ["diagnostic report only"]
    stage_count: 9
    all_stages_have_4_level_fallback: true
  enterprise:
    - service: "PostgreSQL"
      levels: ["read/write pool", "read-only replica + queue writes", "in-memory cache + queue mutations"]
    - service: "OpenSearch"
      levels: ["full-text search", "PostgreSQL LIKE fallback", "cached recent results"]
    - service: "gRPC Agent"
      levels: ["bidirectional streaming", "backoff + local buffer", "offline mode + background reconnect"]
    - service: "WebSocket"
      levels: ["real-time collab", "REST poll 5s", "single-user + conflict resolution"]
    - service: "Redis"
      levels: ["async task queue", "in-process tokio::spawn", "synchronous execution"]

timeout_config:
  community:
    pipeline_total_seconds: 35
    stage_budget_seconds: 32
    overhead_buffer_seconds: 3
    stages:
      - { stage: "EWF Parser", budget: 2 }
      - { stage: "NTFS Volume", budget: 1 }
      - { stage: "USN Parser", budget: 5 }
      - { stage: "MFT Parser", budget: 5 }
      - { stage: "Ghost Recovery", budget: 3 }
      - { stage: "Unallocated Carving", budget: 5 }
      - { stage: "QuadLink Correlator", budget: 3 }
      - { stage: "Triage Engine", budget: 5 }
      - { stage: "Output Formatter", budget: 3 }
  enterprise:
    - { component: "gRPC Agent Submission", timeout_seconds: 10 }
    - { component: "gRPC Agent Heartbeat", timeout_seconds: 5 }
    - { component: "PostgreSQL Query", timeout_seconds: 5 }
    - { component: "PostgreSQL Transaction", timeout_seconds: 30 }
    - { component: "OpenSearch Query", timeout_seconds: 10 }
    - { component: "OpenSearch Bulk Index", timeout_seconds: 30 }
    - { component: "WebSocket Ping/Pong", timeout_seconds: 10 }
    - { component: "REST API Response", timeout_seconds: 15 }

idempotency:
  community:
    mechanism: "deterministic output via sorted records, fixed-seed tie-breaking, no HashMap iteration"
    verification: "re-run same image, diff output files for byte-identical results"
  enterprise:
    mechanism: "UUID idempotency keys on gRPC submissions + ON CONFLICT upsert in PostgreSQL"
    agent_offline_buffer: "local SQLite WAL"

retry_strategies:
  grpc_agent: { max_retries: 5, initial_delay_ms: 500, max_delay_seconds: 30, backoff: 2.0, jitter: 0.25 }
  database: { max_retries: 3, initial_delay_ms: 100, max_delay_seconds: 5, backoff: 2.0, jitter: 0.1 }
  opensearch: { max_retries: 3, initial_delay_ms: 200, max_delay_seconds: 10, backoff: 2.0, jitter: 0.15 }
  websocket: { max_retries: 10, initial_delay_seconds: 1, max_delay_seconds: 60, backoff: 1.5, jitter: 0.3 }

health_checks:
  community:
    - { check: "image readable", timing: "pre-flight", failure_action: "abort" }
    - { check: "disk space", timing: "pre-flight", failure_action: "warn" }
    - { check: "libewf available", timing: "pre-flight", failure_action: "abort if E01" }
    - { check: "memory available", timing: "pre-flight", failure_action: "adjust batch sizes" }
    - { check: "post-analysis health report", timing: "post-pipeline", failure_action: "report to stderr" }
  enterprise:
    - { check: "liveness", endpoint: "/health/live", interval_seconds: 10, failure_action: "restart pod" }
    - { check: "readiness", endpoint: "/health/ready", interval_seconds: 10, failure_action: "remove from LB" }
    - { check: "agent health", endpoint: "/health/agents", interval_seconds: 15, failure_action: "mark stale" }

error_classification:
  - { category: "Configuration", retry: false, example: "missing libewf, bad image path" }
  - { category: "Corrupt Data", retry: false, example: "malformed USN record, bad MFT entry" }
  - { category: "Resource Exhaustion", retry: false, example: "OOM, disk full" }
  - { category: "Transient", retry: true, example: "network timeout, connection reset, 503" }
  - { category: "Security", retry: false, example: "invalid mTLS cert, expired token" }
  - { category: "Fatal", retry: false, example: "kernel panic, SIGKILL" }

core_axiom: "Partial results are better than no results"
never_panic_guarantee: true
forbidden_patterns: [".unwrap()", ".expect()", "panic!()", "unreachable!()"]
