# User Journey Maps - Extracted Outputs
# Generated by North Star Advisor v1.6.0
# Date: 2026-03-10
# Source: north-star-advisor/docs/design/USER_JOURNEYS.md

journeys:
  first_time_user:
    phases:
      - name: "Discovery"
        touchpoint: "GitHub README, conference talk, peer recommendation"
        emotional_state: "Skeptical/Curious"
        kpi: "README visitor count"
      - name: "Install"
        touchpoint: "cargo install or binary download"
        emotional_state: "Pragmatic/Efficient"
        kpi: "Install conversion rate >40%"
      - name: "First Triage"
        touchpoint: "katana triage image.e01"
        emotional_state: "Anxious/Hopeful"
        kpi: "Activation rate >80% within 24h"
      - name: "Review Results"
        touchpoint: "HTML report with Story + Explore tabs"
        emotional_state: "Impressed/Delighted"
        kpi: "Triage completion rate >95%"
      - name: "Validation"
        touchpoint: "Cross-reference with existing tools"
        emotional_state: "Trust-building"
        kpi: "Ghost recovery finds missed evidence"
      - name: "Share"
        touchpoint: "Blog post, Slack mention, peer recommendation"
        emotional_state: "Evangelist/Confident"
        kpi: "GitHub star within 24h of first install"
    friction_points:
      - "Unclear differentiation from MFTECmd in initial discovery"
      - "No output for several seconds during first run creates uncertainty"
      - "Binary not available for user's OS"
    critical_moments:
      - "README scan (first 30 seconds) -- must overcome 'yet another tool' skepticism"
      - "Ghost recovery reveal -- finding evidence other tools missed"
      - "Validation against known tools -- deterministic output builds trust"

  returning_user:
    phases:
      - name: "New Case"
        emotional_state: "Purpose-driven"
      - name: "Triage"
        emotional_state: "Confident/Routine"
      - name: "Review"
        emotional_state: "Efficient/Focused"
      - name: "Export"
        emotional_state: "Integrated/Streamlined"
      - name: "Batch/Iterate"
        emotional_state: "Power-user/Mastery"
    power_user_patterns:
      - "Shell aliases (alias kt='katana triage')"
      - "Pipeline integration (katana triage image.e01 --format jsonl | jq)"
      - "Batch processing (katana triage /evidence/*.e01 --output-dir /reports/)"
      - "Custom output fields (--fields timestamp,path,reason)"
      - "CI/CD integration for automated triage"

  upgrade_journey:
    trigger: "Team friction -- multiple analysts running community Katana independently"
    phases:
      - name: "Individual Delight"
        emotional_state: "Satisfied/Advocate"
      - name: "Team Friction"
        emotional_state: "Frustrated/Advocating"
      - name: "Enterprise Evaluation"
        emotional_state: "Analytical/Comparing"
      - name: "Trial"
        emotional_state: "Validating/Proving ROI"
      - name: "Purchase"
        emotional_state: "Committed/Confident"
    conversion_triggers:
      - "Solo consultant recommends to MSSP team lead"
      - "Team needs multi-device examination"
      - "Audit trail required for compliance"
      - "Velociraptor integration needed for scale"
      - "RBAC for analyst access control"

  enterprise_daily:
    phases:
      - name: "Alert"
        emotional_state: "Urgent/Alert"
      - name: "Collect"
        touchpoint: "Velociraptor collection agent"
        emotional_state: "Methodical/Systematic"
      - name: "Triage"
        touchpoint: "katana triage --case --devices"
        emotional_state: "Focused/Efficient"
      - name: "Collaborate"
        touchpoint: "Team review + case assignment"
        emotional_state: "Coordinated/Collaborative"
      - name: "Report"
        touchpoint: "Court-ready report generation"
        emotional_state: "Confident/Authoritative"

  error_recovery:
    error_type_mapping:
      - type: "Corrupt E01 image"
        severity: "Warning"
        recovery: "Proceed with partial recovery; flag affected ranges"
      - type: "Unsupported filesystem"
        severity: "Blocking"
        recovery: "Exit with code 2; link to supported formats"
      - type: "Missing USN Journal"
        severity: "Warning"
        recovery: "Fall back to unallocated carving only"
      - type: "Permission denied"
        severity: "Blocking"
        recovery: "Exit with code 1; suggest chmod or correct user"
      - type: "Disk space exhausted"
        severity: "Blocking"
        recovery: "Preserve in-memory state; allow retry with --output-dir"
      - type: "Network timeout (enterprise)"
        severity: "Warning"
        recovery: "Proceed with available evidence; provide retry command"
      - type: "Malformed image"
        severity: "Blocking"
        recovery: "Exit with code 2; list supported formats"
    design_principles:
      - "Speed to understanding: 1 line of stderr"
      - "Actionable next step in every error message"
      - "Never lose partial results"
      - "Never blame the user"
      - "Consistent exit codes (0=success, 1=runtime, 2=input)"

  persona_variations:
    - persona: "Alex Chen"
      tier: "community"
      entry_point: "GitHub search, DFIR Slack, conference"
      emotional_arc: "Skeptical -> Impressed -> Loyal -> Evangelist"
      revenue_role: "Evangelist -- discovers, validates, recommends"
    - persona: "Sarah Okonkwo"
      tier: "enterprise"
      entry_point: "Peer recommendation from trusted consultant"
      emotional_arc: "Curious -> Validated -> Frustrated -> Relieved -> Committed"
      revenue_role: "Primary buyer -- 4-8 seats, high volume"
    - persona: "James Whitfield"
      tier: "enterprise"
      entry_point: "Sees MSSP using Katana for his company's IR engagement"
      emotional_arc: "Impressed -> Cautious -> Analytical -> Decisive -> Authoritative"
      revenue_role: "High-value account -- 8-12+ seats, marquee reference"

  metrics:
    kpis:
      - metric: "Install conversion rate"
        target: ">40%"
        measurement: "GitHub visitors vs. downloads"
      - metric: "Activation rate"
        target: ">80% within 24h"
        measurement: "First triage within 24h of install"
      - metric: "7-day retention rate"
        target: ">60%"
        measurement: "Second triage within 7 days"
      - metric: "Enterprise trial conversion"
        target: ">30%"
        measurement: "Trial activations vs. signed contracts"
      - metric: "Error recovery rate"
        target: ">90%"
        measurement: "Successful retry within 5 minutes"
      - metric: "Triage completion rate"
        target: ">95%"
        measurement: "Exit code 0 percentage"
      - metric: "P95 time-to-first-answer"
        target: "<35 seconds"
        measurement: "Triage execution time distribution"
      - metric: "Community -> enterprise trial rate"
        target: ">5% annually"
        measurement: "Trial signups from community users"

  implementation_priorities:
    p0:
      - "First-run progress output with streaming phases"
      - "Error messages with actionable recovery steps"
      - "HTML report with Story + Explore tabs"
      - "<35 second triage performance budget"
    p1:
      - "Multiple output formats (TLN, CSV, JSONL, XML, body, SQLite)"
      - "Ghost recovery with inline count reporting"
      - "Shell completion support"
    p2:
      - "Batch processing with glob support"
      - "Enterprise upgrade information flag"
      - "Enterprise multi-device correlation"
    p3:
      - "Velociraptor collection integration"
      - "RBAC and case assignment"
