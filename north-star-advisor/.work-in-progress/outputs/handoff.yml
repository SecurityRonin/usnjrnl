# Handoff Protocol - Extracted Outputs
# Generated by North Star Advisor v1.6.0
# Date: 2026-03-10
# Product: Security Ronin Katana (usnjrnl-forensic)

handoff_protocol_version: "1.0.0"

handoff_domains:
  - id: "pipeline_stages"
    name: "Pipeline Stage Handoffs"
    tier: "community"
    stage_count: 9
    total_budget_seconds: 35

  - id: "community_enterprise"
    name: "Community-to-Enterprise Handoff"
    tier: "enterprise"
    protocols: ["sqlite_import", "jsonl_streaming"]

  - id: "collection_analysis"
    name: "Collection-to-Analysis Handoff"
    tier: "enterprise"
    transport: "gRPC (tonic + mTLS)"

  - id: "analyst_reviewer"
    name: "Analyst-to-Reviewer Handoff"
    tier: "enterprise"
    workflow_states: ["Created", "Examining", "In Review", "Rework", "Approved", "Closed"]

  - id: "tool_court"
    name: "Tool-to-Court Handoff"
    tier: "both"
    daubert_factors: 5
    coc_fields: 12

pipeline_stages:
  - stage_id: "ewf_parser"
    crate: "katana-ewf"
    budget_seconds: 2
    input: ["image_path", "image_type", "segment_paths"]
    output: ["volume_data", "image_metadata", "partitions"]

  - stage_id: "ntfs_volume"
    crate: "katana-ntfs"
    budget_seconds: 1
    input: ["volume_data", "partition"]
    output: ["mft_data", "usnjrnl_data", "logfile_data", "volume_info", "unallocated_ranges"]

  - stage_id: "usn_parser"
    crate: "katana-core"
    budget_seconds: 5
    parallelism: "rayon"
    input: ["usnjrnl_data", "volume_info"]
    output: ["records", "parse_stats", "journal_bounds"]

  - stage_id: "mft_parser"
    crate: "katana-core"
    budget_seconds: 5
    parallelism: "rayon"
    input: ["mft_data", "volume_info"]
    output: ["mft_entries", "path_index", "parse_stats"]

  - stage_id: "ghost_recovery"
    crate: "katana-core"
    budget_seconds: 3
    input: ["records", "mft_entries", "path_index"]
    output: ["ghost_records", "recovery_stats"]

  - stage_id: "unallocated_carver"
    crate: "katana-core"
    budget_seconds: 5
    parallelism: "rayon"
    input: ["unallocated_ranges", "volume_info"]
    output: ["carved_records", "carve_stats"]

  - stage_id: "quadlink_correlator"
    crate: "katana-core"
    budget_seconds: 3
    input: ["records", "mft_entries", "ghost_records", "carved_records", "path_index"]
    output: ["timeline", "anomalies", "correlation_stats"]

  - stage_id: "triage_engine"
    crate: "katana-core"
    budget_seconds: 5
    parallelism: "rayon"
    input: ["timeline", "anomalies", "correlation_stats", "custom_rules"]
    output: ["answers", "triage_summary"]

  - stage_id: "output_formatter"
    crate: "katana-formats"
    budget_seconds: 3
    input: ["timeline", "triage_answers", "triage_summary", "parse_stats", "output_config"]
    output: ["generated_files", "format_stats"]

error_categories:
  fatal: ["IntegrityViolation", "InputCorrupt", "BudgetExceeded"]
  degraded: ["PartialData", "OptionalMissing"]
  recoverable: ["TransientIo"]

provenance_types: ["Allocated", "Carved", "JournalOnly", "Ghost"]

integration_handoffs: ["KAPE", "Velociraptor", "Sleuthkit/Plaso"]

observability:
  community: "_run_stats.json"
  enterprise: "OpenTelemetry spans + Prometheus metrics"
  metrics_count: 6
  alert_thresholds: 7
