# Implementation Scaffold - Extracted Outputs
# Generated by North Star Advisor v1.6.0
# Date: 2026-03-10
# Product: Security Ronin Katana (usnjrnl-forensic)

scaffold:
  directory_structure:
    community_repo: "katana"
    community_crates:
      - name: "katana-core"
        type: "library"
        purpose: "Shared types, traits (EvidenceSource, TriageEngine, OutputSink), parsers"
      - name: "katana-cli"
        type: "binary"
        binary_name: "katana"
        purpose: "Community CLI for forensic triage"
      - name: "katana-formats"
        type: "library"
        purpose: "Output formatters (CSV, JSON, bodyfile, TLN, XML, SQLite, report)"
      - name: "katana-ewf"
        type: "library"
        purpose: "E01/raw disk image handling via libewf FFI"
      - name: "katana-ntfs"
        type: "library"
        purpose: "NTFS filesystem parsing ($MFT, $UsnJrnl, $LogFile)"
    enterprise_repo: "katana-pro"
    enterprise_crates:
      - name: "katana-server"
        type: "binary"
        binary_name: "katana-server"
        purpose: "Axum REST + tonic gRPC + WebSocket collaboration"
      - name: "katana-agent"
        type: "binary"
        binary_name: "katana-agent"
        purpose: "Remote evidence collection agent (mTLS, <5MB)"
      - name: "katana-pcap"
        type: "library"
        purpose: "PCAP/NetFlow parsing (impl EvidenceSource)"
      - name: "katana-collab"
        type: "library"
        purpose: "Collaborative investigation (WebSocket pub/sub)"
      - name: "katana-import"
        type: "library"
        purpose: "Third-party importers (Velociraptor, Binalyze)"
      - name: "katana-multi"
        type: "library"
        purpose: "Multi-device event correlation"

  shared_traits:
    - name: "EvidenceSource"
      crate: "katana-core"
      methods: ["name", "parse", "supported_extensions", "estimated_duration_secs"]
      implementors: ["katana-ewf", "katana-ntfs", "katana-pcap", "katana-import"]
    - name: "TriageEngine"
      crate: "katana-core"
      methods: ["evaluate", "default_questions", "validate_question"]
      implementors: ["katana-core::triage::DefaultTriageEngine"]
    - name: "OutputSink"
      crate: "katana-core"
      methods: ["format_name", "emit", "default_extension", "supports_streaming"]
      implementors: ["katana-formats (7 formats)", "katana-server (DuckDB, tantivy, WebSocket)"]

  api_routes:
    rest:
      - "POST /api/v1/cases"
      - "GET /api/v1/cases"
      - "GET /api/v1/cases/:id"
      - "PUT /api/v1/cases/:id"
      - "POST /api/v1/evidence/upload"
      - "GET /api/v1/evidence/:id/status"
      - "POST /api/v1/triage/run"
      - "GET /api/v1/triage/:case_id/results"
      - "GET /api/v1/timeline/:case_id"
      - "POST /api/v1/search"
      - "GET /health"
      - "GET /ready"
    grpc:
      - "AgentService.Heartbeat"
      - "AgentService.UploadEvidence"
      - "AgentService.GetPendingTasks"
    websocket:
      - "GET /ws/collab/:case_id"

  config:
    community_env_vars: 0
    enterprise_env_vars: 17
    agent_env_vars: 5
    validation: "envy + custom validate() with TLS file checks, JWT secret length, port ranges"

  ci_cd:
    community:
      - "ci.yml: fmt, clippy, test (3 OS), audit, deny, bench"
      - "release.yml: 6-target cross-compile, SHA256SUMS, GitHub Release"
    enterprise:
      - "ci.yml: fmt, clippy, test (postgres service), audit, deny, agent-size-check"
      - "release.yml: Docker (server + agent), standalone agent binaries (3 targets)"

  binary_packaging:
    community_targets: 6
    agent_targets: 3
    server_distribution: "Docker only (ghcr.io)"
    agent_max_size_mb: 5
