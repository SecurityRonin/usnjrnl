# Pipeline Stage Specifications - Extracted Outputs
# Generated by North Star Advisor v1.6.0
# Date: 2026-03-10
# Product: Security Ronin Katana (usnjrnl-forensic)

stage_contracts:
  community:
    - stage_id: "ewf_parser"
      crate: "katana-ewf"
      job: "Read E01/raw disk images via libewf FFI, expose seekable volume byte stream"
      parallelism: "single-threaded"
      budget_seconds: 2
      input: ["image_path", "image_type", "segment_paths"]
      output: ["volume_data", "image_metadata", "partitions"]
      dependencies: []
      critical_edge_cases: ["split E01 archives", "compressed E01", "images larger than RAM"]

    - stage_id: "ntfs_volume"
      crate: "katana-ntfs"
      job: "Parse NTFS filesystem structures, extract $MFT, $UsnJrnl:$J, $LogFile"
      parallelism: "single-threaded"
      budget_seconds: 1
      input: ["volume_data", "partition"]
      output: ["mft_data", "usnjrnl_data", "logfile_data", "volume_info", "unallocated_ranges"]
      dependencies: ["ewf_parser"]
      critical_edge_cases: ["Bitlocker volumes", "NTFS 3.0 without UsnJrnl", "sparse UsnJrnl"]

    - stage_id: "usn_parser"
      crate: "katana-core"
      job: "Parse USN Journal records with full V2/V3/V4 support and field extraction"
      parallelism: "rayon"
      budget_seconds: 5
      input: ["usnjrnl_data", "volume_info"]
      output: ["records", "parse_stats", "journal_bounds"]
      dependencies: ["ntfs_volume"]
      critical_edge_cases: ["mixed-version journals", "journal wrap-around", "FILETIME epoch sentinels"]

    - stage_id: "mft_parser"
      crate: "katana-core"
      job: "Parse $MFT entries, extract timestamps and paths via CyberCX Rewind algorithm"
      parallelism: "rayon"
      budget_seconds: 5
      input: ["mft_data", "volume_info"]
      output: ["entries", "path_map", "parse_stats"]
      dependencies: ["ntfs_volume"]
      parallel_with: "usn_parser"
      critical_edge_cases: ["circular parent refs", "timestomping detection", "deleted MFT entries"]

    - stage_id: "ghost_recovery"
      crate: "katana-core"
      job: "Recover deleted USN records from journal sparse gaps"
      parallelism: "single-threaded"
      budget_seconds: 3
      input: ["usnjrnl_data", "parsed_records", "journal_bounds", "volume_info"]
      output: ["ghost_records", "recovery_stats"]
      dependencies: ["ntfs_volume", "usn_parser"]
      target_recovery_rate: ">95%"
      critical_edge_cases: ["anti-forensic wiping", "partially overwritten records", "pre-format ghosts"]

    - stage_id: "unallocated_carver"
      crate: "katana-core"
      job: "Carve USN record signatures from unallocated disk clusters"
      parallelism: "rayon"
      budget_seconds: 5
      input: ["volume_data", "unallocated_ranges", "known_records", "volume_info"]
      output: ["carved_records", "carving_stats"]
      dependencies: ["ewf_parser", "ntfs_volume", "usn_parser", "ghost_recovery"]
      target_false_positive_rate: "<1%"
      critical_edge_cases: ["SSD-trimmed regions", "cross-cluster records", "large unallocated space"]

    - stage_id: "quadlink_correlator"
      crate: "katana-core"
      job: "Cross-reference USN, MFT, $LogFile, and file metadata into unified timeline"
      parallelism: "single-threaded"
      budget_seconds: 3
      input: ["usn_records", "ghost_records", "carved_records", "mft_entries", "path_map", "logfile_data"]
      output: ["timeline", "anomalies", "correlation_stats"]
      dependencies: ["usn_parser", "mft_parser", "ghost_recovery", "unallocated_carver"]
      algorithm: "in-memory hash-join on (mft_entry, mft_sequence)"
      target_path_resolution: "100% (zero UNKNOWN)"
      critical_edge_cases: ["MFT entry reuse", "timestamp paradoxes", "corrupted ghost MFT refs"]

    - stage_id: "triage_engine"
      crate: "katana-core"
      job: "Evaluate 12 IR triage questions against correlated timeline"
      parallelism: "rayon"
      budget_seconds: 5
      input: ["timeline", "anomalies", "correlation_stats", "custom_rules"]
      output: ["answers", "triage_summary"]
      dependencies: ["quadlink_correlator"]
      target_completion_rate: ">95%"
      target_false_positive_rate: "<5%"
      critical_edge_cases: ["ghost-only evidence", "conflicting evidence", "custom rule overrides"]

    - stage_id: "output_formatter"
      crate: "katana-formats"
      job: "Generate reports in 7 formats with version headers and integrity hashes"
      parallelism: "single-threaded"
      budget_seconds: 3
      input: ["timeline", "triage_answers", "triage_summary", "parse_stats", "output_config"]
      output: ["generated_files", "format_stats"]
      output_formats: ["sqlite", "jsonl", "csv", "xml", "tln", "html", "body"]
      dependencies: ["quadlink_correlator", "triage_engine"]
      critical_edge_cases: ["timelines >1M events", "Unicode CSV", "air-gapped HTML"]

  enterprise:
    - stage_id: "collection_agent"
      crate: "katana-agent"
      job: "Collect forensic artifacts from live Windows endpoints via mTLS gRPC"
      framework: "tonic gRPC"
      binary_size: "<5MB"
      cold_start: "<50ms"
      input: ["collection_manifest", "server_endpoint", "client_certificate"]
      output: ["collected_artifacts", "collection_report"]
      dependencies: []
      critical_edge_cases: ["locked MFT", "non-admin context", "AV interference"]

    - stage_id: "import_adapter"
      crate: "katana-import"
      job: "Ingest Velociraptor/Binalyze collections, normalize to Katana format"
      input: ["import_source", "collection_path"]
      output: ["normalized_input", "import_report"]
      supported_sources: ["Velociraptor", "Binalyze", "RawDirectory"]
      dependencies: []
      critical_edge_cases: ["encrypted containers", "partial collections", "version mismatches"]

    - stage_id: "multi_device_correlator"
      crate: "katana-multi"
      job: "Correlate timelines across multiple devices for lateral movement detection"
      approach: "streaming"
      input: ["device_timelines", "correlation_keys", "time_window"]
      output: ["cross_device_events", "lateral_movement", "correlation_stats"]
      correlation_keys: ["timestamp", "username", "ip_address", "file_hash", "process_name", "session_id"]
      dependencies: ["quadlink_correlator"]
      critical_edge_cases: ["timezone normalization", "identical hostnames", "clock skew"]

    - stage_id: "pcap_netflow_parser"
      crate: "katana-pcap"
      job: "Parse PCAP/NetFlow captures for network-disk timeline correlation"
      implements: "EvidenceSource trait"
      input: ["capture_path", "capture_type", "filter"]
      output: ["network_events", "dns_resolutions", "parse_stats"]
      supported_formats: ["PCAP", "PCAPNG", "NetFlowV5", "NetFlowV9", "IPFIX"]
      dependencies: []
      critical_edge_cases: ["encrypted TLS traffic", "VLAN tags", "captures >10GB"]

    - stage_id: "collaboration_engine"
      crate: "katana-collab"
      job: "Real-time multi-analyst collaboration via WebSocket pub/sub"
      protocol: "WebSocket"
      input: ["case_id", "analyst_session", "action"]
      output: ["broadcast"]
      max_concurrent_analysts: 50
      sync_latency: "<100ms"
      dependencies: ["rbac_gateway"]
      critical_edge_cases: ["long disconnections", "annotation conflicts", "rate limiting"]

    - stage_id: "rbac_gateway"
      crate: "katana-server"
      job: "Enforce role-based access control on all enterprise API endpoints"
      framework: "Tower middleware"
      input: ["request", "route"]
      output: ["decision"]
      roles: ["Admin", "Case Manager", "Examiner", "Reviewer", "Auditor"]
      auth_latency: "<1ms decision, <5ms token validation"
      dependencies: []
      critical_edge_cases: ["stale role cache", "multi-tenant isolation", "admin lockout"]

    - stage_id: "audit_logger"
      crate: "katana-server"
      job: "Append-only hash-chain audit trail for SOC 2 compliance"
      input: ["audit_event"]
      output: ["log_entry"]
      hash_algorithm: "SHA-256"
      chain_type: "append-only hash-chain"
      retention: "7 years (configurable)"
      dependencies: []
      critical_edge_cases: ["concurrent writes", "chain discontinuity", "recursive audit events"]

pipeline_summary:
  total_stages: 16
  community_stages: 9
  enterprise_stages: 7
  topology: "sequential_pipeline_with_parallel_inner_stages"
  total_budget_seconds: 32
  budget_margin_seconds: 3
  p95_target: "35s for 1GB E01"
  parse_rate_target: "100K+ events/second"

testing:
  reference_corpora:
    - name: "corpus-minimal"
      size: "50MB E01"
      purpose: "CI smoke test"
    - name: "corpus-standard"
      size: "1GB E01"
      purpose: "Performance benchmark"
    - name: "corpus-ghost"
      size: "500MB E01"
      purpose: "Ghost recovery validation"
    - name: "corpus-carved"
      size: "500MB E01"
      purpose: "Carving validation"
    - name: "corpus-adversarial"
      size: "1GB E01"
      purpose: "Triage accuracy testing"
    - name: "corpus-edge"
      size: "200MB E01"
      purpose: "Error handling validation"
  determinism_gate: "SHA-256 output comparison across two identical runs"

contract_version: "1.0.0"
