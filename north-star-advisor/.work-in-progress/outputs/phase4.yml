extract:
  axioms:
    - "Forensic Integrity > Feature Velocity: when a feature compromises evidence fidelity, hash reproducibility, or deterministic output, the feature loses"
    - "Speed-to-Answers > Breadth of Artifacts: the 35-second E01-to-triage ceiling is a hard constraint, not an aspiration"
    - "Deleted Evidence > Convenience: every record that existed on disk must appear in output, complexity is justified"
    - "CLI Composability > Integrated Experience: interoperability with DFIR pipelines beats built-in features"
    - "Open Source Trust > Competitive Moat: Apache-2.0 is non-negotiable, practitioners must audit every line touching evidence"
  non_goals:
    - "Monolithic forensic suite"
    - "GUI-first application"
    - "Enterprise-only product"
    - "Closed-source binary"
    - "Feature-checkbox tool"
    - "Real-time monitoring agent"
    - "Memory forensics tool"
    - "Case management system"
    - "Python implementation"
    - "Database-first architecture"
    - "Plugin/extension system"
    - "Cloud-based processing"
    - "AI/ML-based triage classification"
  constraints:
    - "Solo developer (contributor-friendly module architecture, no plugin API)"
    - "Apache-2.0 license compatibility (no GPL/AGPL/SSPL dependencies)"
    - "Court admissibility (deterministic output, reproducible results, full provenance)"
    - "Open source as leverage (trust earns adoption, audit trail is a feature)"
    - "35-second pipeline ceiling on 40 GB E01 images"
    - "100% offline processing (no network calls, no telemetry)"
  design_patterns:
    - "Progressive Disclosure Pipeline (E01 -> extract -> parse -> correlate -> triage -> output)"
    - "Fallback Chain (QuadLink -> TriForce -> USN+MFT -> USN-only -> error with context)"
    - "Conflict Resolution Hierarchy (Evidence Fidelity > Forensic Completeness > Performance > Convenience)"
    - "Tiered Triage Architecture (5 tiers ordered by incident commander urgency)"
  always:
    - "Report all recovered records including ghosts and carved fragments"
    - "Preserve original timestamps without modification"
    - "Exit with meaningful error codes and structured error messages"
    - "Produce deterministic output for identical input"
    - "Include provenance metadata in every output record"
    - "Log warnings for degraded analysis, never silently skip"
  never:
    - "Silently drop records that fail to parse"
    - "Make network calls during analysis"
    - "Modify or write to the source image or extracted artifacts"
    - "Produce non-deterministic output"
    - "Hide errors behind generic messages"
    - "Add dependencies with non-permissive licenses"
