# North Star Extract outputs for cross-referencing
# Generated: 2026-03-10
# Source: north-star-advisor/docs/NORTHSTAR_EXTRACT.md

extract:
  axioms:
    - id: 1
      name: "Forensic Integrity > Feature Velocity"
      shorthand: "When speed of shipping and accuracy conflict, choose accuracy"
      derived_from: ["brand.beliefs.1", "brand.beliefs.5"]
    - id: 2
      name: "Practitioner Autonomy > Platform Lock-in"
      shorthand: "Community CLI works fully offline, no accounts, no internet"
      derived_from: ["brand.beliefs.4", "competitive.whitespace.government"]
    - id: 3
      name: "35-Second Answers > Comprehensive Coverage"
      shorthand: "Answer 12 questions well, not 100 questions poorly"
      derived_from: ["brand.beliefs.2", "northstar.supporting_metrics.product.time_to_first_answer"]
    - id: 4
      name: "Open Core Trust > Revenue Extraction"
      shorthand: "Community features never move to enterprise; trust is the moat"
      derived_from: ["brand.beliefs.4", "competitive.whitespace.court_defensible"]
    - id: 5
      name: "Assume Breach > Assume Safety"
      shorthand: "Agent compromise must never mean server compromise"
      derived_from: ["brand.beliefs.3", "enterprise.security_requirements"]

  conflict_hierarchy: "Axiom 1 > Axiom 2 > Axiom 3 > Axiom 4 > Axiom 5"

  non_goals:
    features:
      - "GUI-first application"
      - "Plugin/extension system"
      - "Cloud-based processing"
      - "AI/ML-based triage classification"
      - "Database-first architecture"
      - "Memory forensics"
      - "Real-time monitoring"
      - "Case management system"
      - "Collection agent"
      - "Mobile forensics"
      - "SaaS/cloud-hosted platform"
      - "Full NDR platform"
      - "Replacing Velociraptor entirely"
    approaches:
      - "AI-powered triage summaries"
      - "GUI desktop application"
      - "VC funding"
      - "Probabilistic scoring"
      - "Multi-language codebase"

  patterns:
    - name: "Parse > Correlate > Triage > Report"
      type: "pipeline"
      description: "Linear pipeline for all artifact processing"
    - name: "Community Crate > Enterprise Crate"
      type: "extension"
      description: "Trait extension pattern for open-core boundary"
    - name: "Buyer-Based Open Core"
      type: "boundary"
      description: "Individual needs = free, team/org needs = paid"
    - name: "Fallback Chain"
      type: "resilience"
      description: "Graceful degradation from full correlation to single-artifact parse"
    - name: "Conflict Resolution Hierarchy"
      type: "governance"
      description: "Axiom 1 > 2 > 3 > 4 > 5 when decisions conflict"

  always:
    - "Deterministic output for identical input (SHA-256 verified)"
    - "Version output format with hash"
    - "SPDX license headers on every file"
    - "Court-admissible chain of custody tracking"
    - "CLI-first interface design"
    - "Test against reference corpus before release"
    - "Publish precision/recall metrics per triage question"
    - "Zero-UNKNOWN path resolution"

  never:
    - "Move community features to enterprise"
    - "Require internet for forensic analysis"
    - "Silently modify evidence or input data"
    - "Ship without test corpus verification"
    - "Accept non-deterministic output"
    - "Use unsafe without documented justification"
    - "Ship unsigned enterprise binaries"
    - "Silently drop records during parsing"

  re_evaluation_triggers:
    metric:
      - signal: "Enterprise customers stall"
        threshold: "Below 10 after 6 months"
      - signal: "Community adoption plateau"
        threshold: "Below 200 stars after 90 days"
      - signal: "Triage completion rate drop"
        threshold: "Below 90% for 3 releases"
      - signal: "False positive rate climb"
        threshold: "Above 10% for 4 weeks"
      - signal: "P95 triage time regression"
        threshold: "Above 45 seconds for 2 releases"
      - signal: "Ghost recovery rate drop"
        threshold: "Below 90% on reference corpus"
    external:
      - "CrowdStrike ships native NTFS triage"
      - "Microsoft adds forensic triage to Defender"
      - "Velociraptor adds built-in triage questions"
      - "Court rejects open-source tool output"
      - "NTFS specification changes"
    strategic:
      - "Revenue exceeds $100K MRR"
      - "50+ upvote community request for rejected feature"
      - "Competitor open-sources ghost recovery"
      - "Collection agent CVE affects Katana users"
