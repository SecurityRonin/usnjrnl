# UI Design System - Extracted Outputs
# Generated by North Star Advisor v1.6.0
# Date: 2026-03-10
# Source: north-star-advisor/docs/design/UI_DESIGN_SYSTEM.md

design:
  surfaces:
    - name: "CLI terminal output"
      tier: "community + enterprise"
      technology: "Rust colored crate, ANSI escapes"
    - name: "HTML report"
      tier: "community + enterprise"
      technology: "Static HTML/CSS/JS generated by Rust"
    - name: "Enterprise web UI"
      tier: "enterprise only"
      technology: "Axum + Askama + vanilla CSS + WebSocket"

  theme: "dark"
  rationale: "Forensic analysts work long analysis sessions; dark theme reduces eye strain and matches terminal environments"

  colors:
    background: "#0d1117"
    surface: "#161b22"
    surface_elevated: "#1c2128"
    accent: "#58a6ff"
    accent_hover: "#79b8ff"
    text_primary: "#e6edf3"
    text_secondary: "#9da5b4"
    text_muted: "#545d68"
    text_inverse: "#0d1117"
    border: "#30363d"
    border_strong: "#484f58"
    critical: "#ff4757"
    high: "#ff6b6b"
    info: "#58a6ff"
    success: "#3fb950"
    warning: "#d29922"
    error: "#f85149"
    ghost: "#bc8cff"

  typography:
    font_display: "Inter, Segoe UI, system-ui, -apple-system, sans-serif"
    font_body: "Inter, Segoe UI, system-ui, -apple-system, sans-serif"
    font_mono: "JetBrains Mono, Fira Code, Cascadia Code, SF Mono, Consolas, monospace"

  cli_tokens:
    severity_critical: "\\x1b[1;91m"
    severity_high: "\\x1b[91m"
    severity_medium: "\\x1b[93m"
    severity_low: "\\x1b[96m"
    severity_info: "\\x1b[37m"
    structure_header: "\\x1b[1;97m"
    structure_path: "\\x1b[33m"
    structure_timestamp: "\\x1b[34m"
    structure_count: "\\x1b[1;32m"
    structure_hash: "\\x1b[35m"
    ghost_recovery: "\\x1b[35m"
    progress_active: "\\x1b[1;96m"
    progress_done: "\\x1b[32m"

  components:
    shared:
      - "severity_badge"
      - "evidence_card"
      - "loading_states"
    html_report:
      - "report_tab_switcher"
      - "timeline_entry"
      - "data_table"
      - "evidence_card"
    enterprise_web:
      - "buttons (primary, secondary, ghost, danger)"
      - "case_status_badge"
      - "input_fields"
      - "dashboard_card"
      - "analyst_avatar"
      - "audit_trail_entry"
      - "rbac_navigation"
      - "websocket_indicator"
      - "pipeline_progress"
      - "skeleton_loader"

  icon_set: "Lucide"
  icon_license: "MIT"
  core_icons:
    - name: "Briefcase"
      purpose: "Case"
    - name: "HardDrive"
      purpose: "Evidence"
    - name: "Swords"
      purpose: "Triage"
    - name: "Clock"
      purpose: "Timeline"
    - name: "Ghost"
      purpose: "Ghost Recovery"
    - name: "AlertTriangle"
      purpose: "Critical Alert"
    - name: "CheckCircle"
      purpose: "Success"
    - name: "Filter"
      purpose: "Table Filter"
    - name: "Search"
      purpose: "Search"
    - name: "Download"
      purpose: "Export"
    - name: "User"
      purpose: "Analyst"
    - name: "Settings"
      purpose: "Admin"
    - name: "ScrollText"
      purpose: "Audit Trail"

  breakpoints:
    md: "768px"
    lg: "1024px"
    xl: "1280px"
    xxl: "1536px"
    mobile: "not supported -- forensic analysis is not performed on phones"

  accessibility:
    wcag_level: "AA"
    contrast_ratio_text: "13.2:1"
    contrast_ratio_focus_ring: "5.2:1"
    reduced_motion: "supported via prefers-reduced-motion"
    color_blind_safe: "severity indicators always include text labels alongside color"
    no_color_support: "NO_COLOR env var, --no-color flag, TERM=dumb, non-TTY pipe detection"

  css_approach: "vanilla CSS with custom properties (no framework)"
  framework: "Axum + Askama (enterprise web)"
