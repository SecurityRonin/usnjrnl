# Architecture Blueprint - Extracted Outputs
# Generated by North Star Advisor v1.6.0
# Date: 2026-03-10
# Product: Security Ronin Katana (usnjrnl-forensic)

pipeline_topology:
  pattern: "sequential_pipeline_with_parallel_inner_stages"
  stages:
    - name: "EWF Parser"
      crate: "katana-ewf"
      tier: "community"
      parallelism: "single-threaded"
      budget_seconds: 2
    - name: "NTFS Volume"
      crate: "katana-ntfs"
      tier: "community"
      parallelism: "single-threaded"
      budget_seconds: 1
    - name: "USN Journal Parser"
      crate: "katana-core"
      tier: "community"
      parallelism: "rayon"
      budget_seconds: 5
    - name: "MFT Parser"
      crate: "katana-core"
      tier: "community"
      parallelism: "rayon"
      budget_seconds: 5
    - name: "Ghost Recovery"
      crate: "katana-core"
      tier: "community"
      parallelism: "single-threaded"
      budget_seconds: 3
    - name: "Unallocated Carving"
      crate: "katana-core"
      tier: "community"
      parallelism: "rayon"
      budget_seconds: 5
    - name: "QuadLink Correlator"
      crate: "katana-core"
      tier: "community"
      parallelism: "single-threaded"
      budget_seconds: 3
    - name: "Triage Engine"
      crate: "katana-core"
      tier: "community"
      parallelism: "rayon"
      budget_seconds: 5
    - name: "Output Formatter"
      crate: "katana-formats"
      tier: "community"
      parallelism: "single-threaded"
      budget_seconds: 3

enterprise_services:
  - name: "Katana Server"
    crate: "katana-server"
    framework: "axum"
    components:
      - "REST API"
      - "gRPC Server (tonic)"
      - "RBAC middleware (Tower)"
      - "WebSocket collaboration"
  - name: "Collection Agent"
    crate: "katana-agent"
    framework: "tonic gRPC"
    binary_size: "<5MB"
    cold_start: "<50ms"
  - name: "PCAP/NetFlow Parser"
    crate: "katana-pcap"
    implements: "EvidenceSource trait"
  - name: "Multi-Device Correlator"
    crate: "katana-multi"
    approach: "streaming"
  - name: "Collaborative Engine"
    crate: "katana-collab"
    protocol: "WebSocket pub/sub"
  - name: "Import Adapters"
    crate: "katana-import"
    sources: ["Velociraptor", "Binalyze"]

extension_traits:
  - name: "EvidenceSource"
    crate: "katana-core"
    license: "Apache-2.0"
    methods: ["name", "parse"]
  - name: "TriageEngine"
    crate: "katana-core"
    license: "Apache-2.0"
    methods: ["evaluate"]
  - name: "OutputSink"
    crate: "katana-core"
    license: "Apache-2.0"
    methods: ["emit"]

latency_budget:
  community:
    p95: "35s"
    target_image_size: "1GB E01"
    parse_rate: "100K+ events/second"
  enterprise:
    core_triage: "same as community"
    network_overhead: "<500ms"
    agent_cold_start: "<50ms"

tech_stack:
  community:
    - { layer: "Language", choice: "Rust 2021", crate: null }
    - { layer: "CLI", choice: "clap 4.x", crate: "clap" }
    - { layer: "Parallelism", choice: "rayon 1.x", crate: "rayon" }
    - { layer: "Memory-mapped I/O", choice: "memmap2 0.9+", crate: "memmap2" }
    - { layer: "Zero-copy parsing", choice: "zerocopy 0.7+", crate: "zerocopy" }
    - { layer: "Database", choice: "SQLite", crate: "rusqlite" }
    - { layer: "Serialization", choice: "serde + serde_json", crate: "serde" }
  enterprise:
    - { layer: "Web framework", choice: "Axum 0.8", crate: "axum" }
    - { layer: "gRPC", choice: "tonic 0.14+", crate: "tonic" }
    - { layer: "TLS", choice: "rustls 0.23+", crate: "rustls" }
    - { layer: "Auth", choice: "JWT + Argon2id", crate: "jsonwebtoken" }
    - { layer: "Database", choice: "PostgreSQL", crate: "sqlx" }
    - { layer: "Search", choice: "tantivy 0.22+", crate: "tantivy" }
    - { layer: "PCAP", choice: "pcap-parser + etherparse", crate: "pcap-parser" }
    - { layer: "NetFlow", choice: "netflow_parser 0.4+", crate: "netflow_parser" }

workspace_structure:
  community_repo: "katana"
  community_license: "Apache-2.0"
  community_crates:
    - "katana-core"
    - "katana-cli"
    - "katana-formats"
    - "katana-ewf"
    - "katana-ntfs"
  enterprise_repo: "katana-pro"
  enterprise_license: "Proprietary"
  enterprise_crates:
    - "katana-server"
    - "katana-agent"
    - "katana-pcap"
    - "katana-collab"
    - "katana-import"
    - "katana-multi"
  linking_pattern: "path dependencies (dev) / git dependencies (CI)"

rbac_roles:
  - { role: "Admin", scope: "system-wide" }
  - { role: "Case Manager", scope: "case-level" }
  - { role: "Examiner", scope: "case + evidence" }
  - { role: "Reviewer", scope: "read-only" }
  - { role: "Auditor", scope: "audit logs only" }

security_posture:
  agent_security:
    - "mTLS with certificate pinning"
    - "No static credentials"
    - "Code signing required"
    - "Unidirectional trust (agent -> server)"
    - "Integrity hashing before transmission"
    - "Resource throttling"
  audit_trail: "append-only hash-chain (SHA-256)"
  multi_tenancy: "schema-per-tenant in PostgreSQL"

resilience_patterns:
  community:
    - { failure: "Corrupt E01", strategy: "partial processing + warning" }
    - { failure: "Missing USN Journal", strategy: "MFT-only fallback" }
    - { failure: "MFT parse failure", strategy: "USN-only mode" }
    - { failure: "Path resolution failure", strategy: "mark UNKNOWN, continue" }
  enterprise:
    - { failure: "Agent connection lost", strategy: "exponential backoff + resume" }
    - { failure: "Server unavailable", strategy: "local queue + retry" }
    - { failure: "Database unreachable", strategy: "read-only mode + queue writes" }

correlation:
  community: "batch (in-memory hash-join)"
  enterprise: "streaming (incremental)"
  keys: ["timestamp", "username", "ip_address", "file_hash", "process_name", "session_id"]
