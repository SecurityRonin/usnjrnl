[package]
name = "usnjrnl-forensic"
version = "0.7.3"
edition = "2021"
rust-version = "1.85"
description = "NTFS USN Journal parser with full path reconstruction via journal rewind"
license = "Apache-2.0"
repository = "https://github.com/SecurityRonin/usnjrnl-forensic"
authors = ["Albert Hui"]
# Keep the published crate lean: ship src + the include_str! report template +
# tests/examples, but not demo HTML, screenshots, planning docs, or dev config.
exclude = [
    "/.github",
    "/.playwright-mcp",
    "/docs",
    "/north-star-advisor",
    "/fuzz",
    "/CLAUDE.md",
    "/linkedin-posts.md",
    "/precision_recall.html",
]

[[bin]]
name = "usnjrnl-forensic"
path = "src/main.rs"

[dependencies]
forensicnomicon = { version = "0.3.1", features = ["serde"] }
# CLI
clap = { version = "4", features = ["derive"] }

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Path display
shrinkpath = { version = "0.1", default-features = false }

# Data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
bitflags = "2"
regex = "1"

# Parallelism
rayon = "1.10"

# Error handling
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# SQLite output
rusqlite = { version = "0.32", features = ["bundled"] }

# Temp directory for image extraction
tempfile = "3"

# Disk image support (optional, MIT-licensed)
ewf = { version = "0.1", optional = true }
# Self-owned NTFS reader (replaces the ntfs crate in extraction). The reader
# lives in ntfs-core since the 0.4 core/forensic workspace split; the analyzer
# (anomaly auditor) is the separate ntfs-forensic crate, which we don't need here.
ntfs-core = "0.6"

[features]
default = []
image = ["ewf"]

[dev-dependencies]
# Runs once before any test to enable log-macro argument evaluation under
# coverage (the macros otherwise short-circuit when no max level is set).
ctor = "0.2"
