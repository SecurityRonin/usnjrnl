[package]
name = "usnjrnl-forensic-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The $MFT/$LogFile/$MFTMirr parsers + carver live in ntfs-core since the
# reader migration; fuzz them where they live (matches the parent crate's pin).
ntfs-core = "0.9"

[dependencies.usnjrnl-forensic]
path = ".."

[[bin]]
name = "usn_record"
path = "fuzz_targets/usn_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "usn_carve"
path = "fuzz_targets/usn_carve.rs"
test = false
doc = false
bench = false

[[bin]]
name = "logfile"
path = "fuzz_targets/logfile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "logfile_usn_extract"
path = "fuzz_targets/logfile_usn_extract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mft_parse"
path = "fuzz_targets/mft_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mft_carve"
path = "fuzz_targets/mft_carve.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mftmirr"
path = "fuzz_targets/mftmirr.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
