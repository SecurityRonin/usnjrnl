name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@9bdad043e88c75890e36ad3bbc8d27f0090dd609 # v2.7.8
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@9bdad043e88c75890e36ad3bbc8d27f0090dd609 # v2.7.8
      - run: cargo test --all-features

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@9bdad043e88c75890e36ad3bbc8d27f0090dd609 # v2.7.8
      - run: cargo build

  coverage:
    name: Coverage (>=99% lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@9bdad043e88c75890e36ad3bbc8d27f0090dd609 # v2.7.8
      - uses: taiki-e/install-action@59012be0884e296ca2da49b530610e72c49039ad # v2.81.6
        with:
          tool: cargo-llvm-cov
      # Scope is --lib (matching ntfs-forensic): the `image` feature's EWF
      # extract path (extract_artifacts*) is only reachable with a multi-GB NTFS
      # disk image, so it is validated by the real-image integration test
      # tests/extract_parity.rs rather than this unit-coverage gate.
      #
      # The crate sits at ~99.5% line coverage. The residual <1% is provably
      # unreachable defensive code (e.g. `else { continue }` guarded redundant by
      # an earlier length check) plus llvm artifacts (the Err arm of `?` on an
      # operation that never fails, multi-line-branch merge points). Forcing
      # these to literal 100% would mean deleting robustness or writing
      # assertion-free tests, so the gate enforces a 99% floor instead. The
      # meaningful assurance for this untrusted-input parser is fuzzing (the
      # `fuzz` job) plus real-image differential validation (extract_parity.rs).
      - name: Enforce >=99% line coverage
        run: cargo llvm-cov --lib --fail-under-lines 99
      # Informational: list any uncovered lines without failing the build.
      - name: Report uncovered lines
        if: always()
        run: |
          cargo llvm-cov --lib --lcov --output-path lcov.info
          awk -F: '/^SF:/{f=$2} /^DA:[0-9]+,0$/{split($2,a,","); print f":"a[1]}' lcov.info || true

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@3fd3802e88374d3fe9159b834c7714ec57d6c979 # v2.0.15
        with:
          command: check

  fuzz:
    name: Fuzz targets (nightly)
    runs-on: ubuntu-latest
    # cargo-fuzz builds with the host nightly; warnings in its own deps must not
    # fail the install, so this job does not deny warnings.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@9bdad043e88c75890e36ad3bbc8d27f0090dd609 # v2.7.8
      - run: cargo install cargo-fuzz
      - name: Build all fuzz targets
        run: cargo +nightly fuzz check
      - name: Smoke-fuzz each target (30s)
        run: |
          for f in fuzz/fuzz_targets/*.rs; do
            t="$(basename "$f" .rs)"
            cargo +nightly fuzz run "$t" -- -max_total_time=30 -rss_limit_mb=4096
          done

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@9bdad043e88c75890e36ad3bbc8d27f0090dd609 # v2.7.8
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
