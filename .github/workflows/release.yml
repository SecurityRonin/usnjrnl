name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: Build release binary
        run: cargo build --release

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path "target\release\usnjrnl-forensic.exe" -DestinationPath "usnjrnl-forensic-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip"

      - name: Build MSI
        shell: pwsh
        run: |
          cargo install cargo-wix
          cargo wix init --force
          cargo wix --no-build --nocapture --output "usnjrnl-forensic-${{ github.ref_name }}-x86_64-pc-windows-msvc.msi"

      - name: Attest zip
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "usnjrnl-forensic-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip"

      - name: Attest MSI
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "usnjrnl-forensic-${{ github.ref_name }}-x86_64-pc-windows-msvc.msi"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          generate_release_notes: true
          files: |
            usnjrnl-forensic-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
            usnjrnl-forensic-${{ github.ref_name }}-x86_64-pc-windows-msvc.msi

  # Publish the crate to crates.io on the release tag (was hand-published before).
  # Gated on build; idempotent (skip if this version is already on crates.io) so a
  # re-tag never wedges on "already exists". Uses the org CARGO_REGISTRY_TOKEN.
  publish-crate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: cargo publish (skip if already published)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if curl -sf "https://index.crates.io/us/nj/usnjrnl-forensic" | grep -q "\"vers\":\"$VER\""; then
            echo "usnjrnl-forensic $VER already on crates.io — skipping publish"
          else
            cargo publish --locked
          fi
